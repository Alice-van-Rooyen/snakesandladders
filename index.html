<!--
This file is not intended to be edited.
All content lives in data/squares.json
-->


<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Snakes Board</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e6e6e6; /* light grey */
    }

    canvas {
      width: 90vmin;
      height: 90vmin;
      background: #eee;
      border: 5px solid #000;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    }
  </style>
</head>

<body>
  <canvas id="game"></canvas>

  <script type="module">
    // ===============================
    // 1. BASIC CANVAS SETUP
    // ===============================

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const board = new Image();
    board.src = "assets/board.png";

    let showGrid = false;

    const imageCache = new Map();
    function getImage(path) {
      if (!path) return null;
      if (imageCache.has(path)) return imageCache.get(path);

      const img = new Image();
      img.src = path;
      imageCache.set(path, img);
      return img;
    }

    window.addEventListener("keydown", (e) => {

      if (e.key.toLowerCase() === "g") {
        showGrid = !showGrid;
        draw();
        return;
      }

      if (e.code === "Space") {
        e.preventDefault();
        playerSquare = Math.min(100, playerSquare + 1);
        applySpinner();
        draw();
      }
    });


    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const cssSize = canvas.clientWidth;

      canvas.width = Math.round(cssSize * dpr);
      canvas.height = Math.round(cssSize * dpr);

      // Draw in CSS pixels (0..cssSize), not device pixels
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // ===============================
    // SPINNER STATE
    // ===============================
    let playerSquare = 1;
    let spinners = {};
    let logLines = [];
    let busy = false;

    function log(msg) {
      logLines.unshift(msg);
      logLines = logLines.slice(0, 6);
    }

    // ===============================
    // 2. LOAD THE JSON
    // ===============================

    let squareInfo = {};      // per-square text/icon
    let tileBySquare = {};    // per-square tile image path
    let tilePaths = {};       // name -> path (from JSON)

    async function loadSquares() {
      const res = await fetch("data/squares.json?v=" + Date.now());
      const data = await res.json();

      tilePaths = data.tiles || {};
      squareInfo = data.squares || {};
      spinners = data.spinners || {};

      const defaultName = data.defaultTile;
      const defaultPath = tilePaths[defaultName];

      // Default everything
      tileBySquare = {};
      for (let n = 1; n <= 100; n++) {
        tileBySquare[n] = defaultPath;
      }

      // Override sets
      const sets = data.tileSets || {};
      for (const colourName of Object.keys(sets)) {
        const path = tilePaths[colourName];
        const list = sets[colourName] || [];
        for (const n of list) {
          tileBySquare[n] = path;
        }
      }
    }

    // ===============================
    // 3. SQUARE → ROW/COLUMN
    // ===============================

    function squareToRowCol(n) {
      const index = n - 1;
      const rowFromBottom = Math.floor(index / 10);
      const colInRow = index % 10;

      const row = 9 - rowFromBottom;
      const col = (rowFromBottom % 2 === 0) ? colInRow : 9 - colInRow;

      return { row, col };
    }

    function cellRect(row, col) {
      const S = canvas.clientWidth;
      const cell = S / 10;

      return { x: col * cell, y: row * cell, w: cell, h: cell };
    }

    // ===============================
    // 4. INLINE TEXT STYLES
    // ===============================

    // Supports:
    // **bold**
    // *italic*
    function parseStyledLine(line) {
      const parts = [];
      let i = 0;

      while (i < line.length) {
        // bold **text**
        if (line.startsWith("**", i)) {
          const end = line.indexOf("**", i + 2);
          if (end !== -1) {
            parts.push({ text: line.slice(i + 2, end), style: "bold" });
            i = end + 2;
            continue;
          }
        }

        // italic *text*
        if (line.startsWith("*", i)) {
          const end = line.indexOf("*", i + 1);
          if (end !== -1) {
            parts.push({ text: line.slice(i + 1, end), style: "italic" });
            i = end + 1;
            continue;
          }
        }

        // normal chunk until next marker
        let next = line.length;
        const b = line.indexOf("**", i);
        const it = line.indexOf("*", i);
        if (b !== -1) next = Math.min(next, b);
        if (it !== -1) next = Math.min(next, it);

        parts.push({ text: line.slice(i, next), style: "normal" });
        i = next;
      }

      return parts;
    }

    // ===============================
    // SPINNER + GAME STATE
    // ===============================

    let spinners = {};         // loaded from JSON
    let playerSquare = 1;      // current position
    let busy = false;          // prevents double-triggers
    let logLines = [];         // tiny debug feed

    function log(msg) {
      logLines.unshift(msg);
      logLines = logLines.slice(0, 6);
    }
    
    // ===============================
    // 5. DRAW TEXT IN A SQUARE
    // ===============================

    function drawText(text, r) {
  if (!text) return;

  const padding = 6;
  const paragraphGap = 0.3; // 0.3–0.6 feels good
  const maxWidth = r.w - padding * 2;

  let fontSize = 12;
  const minFont = 6;

  ctx.fillStyle = "#000";
  ctx.textBaseline = "top";

  while (fontSize >= minFont) {
    // Wrap measurements use normal font
    ctx.font = `${fontSize}px system-ui`;

    // Build wrapped lines, respecting manual \n breaks
    const paragraphs = text.split("\n");
    const lines = [];

    for (const para of paragraphs) {
      const words = para.split(" ");
      let line = "";

      for (const word of words) {
        const test = line ? `${line} ${word}` : word;
        if (ctx.measureText(test).width > maxWidth) {
          if (line) lines.push(line);
          line = word;
        } else {
          line = test;
        }
      }
      if (line) lines.push(line);

      // add a small paragraph gap marker
      lines.push({ type: "gap" });
    }

    // Remove the final gap marker
    if (lines.length && lines[lines.length - 1]?.type === "gap") lines.pop();

    const lineHeight = Math.round(fontSize * 1.1);

    const blockHeight = lines.reduce((h, item) => {
      return h + (item?.type === "gap" ? lineHeight * paragraphGap : lineHeight);
    }, 0);

    if (blockHeight <= r.h - padding * 2) {
      const startY = r.y + (r.h - blockHeight) / 2;
      const centerX = r.x + r.w / 2;

      let cursorY = startY;

      lines.forEach(item => {
        if (item?.type === "gap") {
          cursorY += lineHeight * paragraphGap;
          return;
        }

        const ln = item;
        const y = cursorY;

        const parts = parseStyledLine(ln);

        // Measure total width across styled segments
        let totalWidth = 0;
        parts.forEach(p => {
          ctx.font =
            p.style === "bold"   ? `bold ${fontSize}px system-ui` :
            p.style === "italic" ? `italic ${fontSize}px system-ui` :
                                   `${fontSize}px system-ui`;
          totalWidth += ctx.measureText(p.text).width;
        });

        // Draw left-to-right from left anchor, centered overall
        let x = centerX - totalWidth / 2;
        ctx.textAlign = "left";

        parts.forEach(p => {
          ctx.font =
            p.style === "bold"   ? `bold ${fontSize}px system-ui` :
            p.style === "italic" ? `italic ${fontSize}px system-ui` :
                                   `${fontSize}px system-ui`;

          ctx.fillText(p.text, x, y);
          x += ctx.measureText(p.text).width;
        });

        ctx.textAlign = "center";
        cursorY += lineHeight;
      });

      return;
    }

    fontSize--;
  }

  // Fallback: always show something
  ctx.font = `${minFont}px system-ui`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("…", r.x + r.w / 2, r.y + r.h / 2);

  // restore
  ctx.textBaseline = "top";
}

    // ===============================
    // 6.APPLY SPINNER
    // ===============================
    function applySpinner() {
      const spinner = spinners[playerSquare];
      if (!spinner) return;

    const options = spinner.choices || [];
      if (!options.length) return;

    const pick = options[Math.floor(Math.random() * options.length)];

    if (pick.move !== undefined) {
    playerSquare += pick.move;
    log(`Spinner: ${pick.move > 0 ? "+" : ""}${pick.move}`);
  } else if (pick.to !== undefined) {
    playerSquare = pick.to;
    log(`Jump to ${pick.to}`);
  }
}


    // ===============================
    // 6. DRAW GRID (DEBUG)
    // ===============================

    function drawGridOverlay() {
      const S = canvas.clientWidth;
      const cell = S / 10;

      ctx.strokeStyle = "red";
      ctx.lineWidth = 3;

      for (let i = 0; i <= 10; i++) {
        const x = i * cell;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, S);
        ctx.stroke();
      }

      for (let i = 0; i <= 10; i++) {
        const y = i * cell;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(S, y);
        ctx.stroke();
      }
    }

    // ===============================
    // 7. DRAW TILES
    // ===============================

    function drawTile(tilePath, r) {
      const img = getImage(tilePath);
      if (!img || !img.complete) return;

      const pad = Math.max(2, r.w * 0.06); // gutter to keep hand-drawn grid visible
      ctx.drawImage(img, r.x + pad, r.y + pad, r.w - 2 * pad, r.h - 2 * pad);
    }

    // ===============================
    // 8. MAIN DRAW
    // ===============================

    function draw() {
      const S = canvas.clientWidth;
      ctx.clearRect(0, 0, S, S);
      ctx.drawImage(board, 0, 0, S, S);

      for (let n = 1; n <= 100; n++) {
        const entry = squareInfo[n];
        const { row, col } = squareToRowCol(n);
        const rect = cellRect(row, col);

        drawTile(tileBySquare[n], rect);
        if (entry) drawText(entry.text, rect);
      }

      if (showGrid) drawGridOverlay();
    }


    // ===============================
    // 8. DRAW TOKEN
    // ===============================

    function drawToken() {
  const { row, col } = squareToRowCol(playerSquare);
  const r = cellRect(row, col);

  ctx.beginPath();
  ctx.arc(r.x + r.w * 0.85, r.y + r.h * 0.15, r.w * 0.08, 0, Math.PI * 2);
  ctx.fillStyle = "red";
  ctx.fill();
}

    // ===============================
    // 8. DRAW LOG
    // ===============================
function drawLog() {
  const w = 260;
  const h = 100;
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.fillRect(10, 10, w, h);

  ctx.fillStyle = "#000";
  ctx.font = "12px system-ui";
  ctx.textBaseline = "top";

  logLines.forEach((line, i) => {
    ctx.fillText(line, 16, 16 + i * 14);
  });
}


    
    // ===============================
    // 9. START
    // ===============================

    async function start() {
      resizeCanvas();

      try {
        await loadSquares();
      } catch (err) {
        console.error("loadSquares failed:", err);
      }

      draw();
    }

    board.onload = start;

    window.addEventListener("resize", () => {
      resizeCanvas();
      draw();
    });
  </script>
</body>
</html>
