<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Recovery Board</title>

<style>
  body {
    margin: 0;
    background: #e6e6e6;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  canvas {
    width: 90vmin;
    height: 90vmin;
    background: #eee;
    border: 6px solid black;
  }
</style>
</head>

<body>
<canvas id="game"></canvas>

<script>
/* ================= BASIC SETUP ================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const SIZE = 10;
const TILE_COUNT = 100;

canvas.width = canvas.height = 900;

let playerSquare = 1;
let visited = [1];

const boardImg = new Image();
boardImg.src = "assets/board.png";

const tokenImg = new Image();
tokenImg.src = "assets/token.png";

/* ------------------ DATA ------------------ */

const spinners = {
  17: { move: -3 },
  42: { move: +5 }
};

// simple filler text for now
const squareText = {};
for (let i = 1; i <= 100; i++) {
  squareText[i] = `Square ${i}`;
}

/* ================= GRID HELPERS ================= */

function squareToRowCol(n) {
  const index = n - 1;
  const rowFromBottom = Math.floor(index / 10);
  const col = rowFromBottom % 2 === 0 ? index % 10 : 9 - (index % 10);
  return { row: 9 - rowFromBottom, col };
}

function cellRect(row, col) {
  const s = canvas.width / 10;
  return { x: col * s, y: row * s, w: s, h: s };
}

/* ================= VISIBILITY ================= */

function getVisibleSquares() {
  const set = new Set();
  set.add(playerSquare);
  set.add(playerSquare - 1);
  set.add(playerSquare + 1);
  return set;
}

/* ================= DRAWING ================= */

function drawTileBackground(r) {
  ctx.fillStyle = "#fff";
  ctx.fillRect(r.x, r.y, r.w, r.h);
}

function drawText(text, r) {
  ctx.fillStyle = "#000";
  ctx.font = "11px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  const words = text.split(" ");
  let line = "";
  let y = r.y + r.h / 2 - 10;

  for (let w of words) {
    let test = line + w + " ";
    if (ctx.measureText(test).width > r.w - 6) {
      ctx.fillText(line, r.x + r.w / 2, y);
      line = w + " ";
      y += 12;
    } else {
      line = test;
    }
  }
  ctx.fillText(line, r.x + r.w / 2, y);
}

function drawToken() {
  const { row, col } = squareToRowCol(playerSquare);
  const r = cellRect(row, col);

  ctx.beginPath();
  ctx.arc(r.x + r.w * 0.8, r.y + r.h * 0.2, r.w * 0.12, 0, Math.PI * 2);
  ctx.fillStyle = "red";
  ctx.fill();
}

/* ================= DRAW LOOP ================= */

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(boardImg, 0, 0, canvas.width, canvas.height);

  const visible = getVisibleSquares();

  for (let i = 1; i <= 100; i++) {
    const { row, col } = squareToRowCol(i);
    const r = cellRect(row, col);

    if (visible.has(i)) {
      drawText(squareText[i], r);
    } else {
      ctx.fillStyle = "rgba(255,255,255,0.7)";
      ctx.fillRect(r.x, r.y, r.w, r.h);
    }
  }

  drawToken();
}

/* ================= MOVEMENT ================= */

function movePlayer(step) {
  playerSquare = Math.max(1, Math.min(100, playerSquare + step));
  visited.push(playerSquare);

  // Spinner check
  if (spinners[playerSquare]) {
    playerSquare += spinners[playerSquare].move;
    playerSquare = Math.max(1, Math.min(100, playerSquare));
  }

  draw();
}

/* ================= INPUT ================= */

window.addEventListener("keydown", e => {
  if (e.key === " ") {
    e.preventDefault();
    movePlayer(1);
  }
});

/* ================= START ================= */

boardImg.onload = () => draw();
</script>
</body>
</html>
