<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Snakes Board</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e6e6e6;
    }

    canvas {
      width: 90vmin;
      height: 90vmin;
      background: #eee;
      border: 5px solid #000;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    }
  </style>
</head>

<body>
<canvas id="game"></canvas>

<script type="module">
/* ===============================
   CORE SETUP
=============================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const board = new Image();
board.src = "assets/board.png";

let showGrid = false;
let playerSquare = 1;
let logLines = [];

const imageCache = new Map();

/* ===============================
   HELPERS
=============================== */

function getImage(path) {
  if (!path) return null;
  if (imageCache.has(path)) return imageCache.get(path);
  const img = new Image();
  img.src = path;
  imageCache.set(path, img);
  return img;
}

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const size = canvas.clientWidth;

  canvas.width = size * dpr;
  canvas.height = size * dpr;

  contentLayer.width = size * dpr;
  contentLayer.height = size * dpr;

  // draw in CSS pixels
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  contentCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  ctx.imageSmoothingEnabled = false;
  contentCtx.imageSmoothingEnabled = false;
}


function distance(a, b) {
  const ra = squareToRowCol(a);
  const rb = squareToRowCol(b);
  return Math.abs(ra.row - rb.row) + Math.abs(ra.col - rb.col);
}

  
/* ===============================
   GAME DATA
=============================== */

let squareInfo = {};
let tileBySquare = {};
let spinners = {};

async function loadSquares() {
  const res = await fetch("data/squares.json");
  const data = await res.json();

  squareInfo = data.squares || {};
  spinners   = data.spinners || {};

  const defaultTile = data.tiles[data.defaultTile];
  tileBySquare = {};

  for (let i = 1; i <= 100; i++) tileBySquare[i] = defaultTile;

  for (const key in data.tileSets) {
    for (const n of data.tileSets[key]) {
      tileBySquare[n] = data.tiles[key];
    }
  }
}

/* ===============================
   GRID MATH
=============================== */

function squareToRowCol(n) {
  const index = n - 1;
  const rowFromBottom = Math.floor(index / 10);
  const col = (rowFromBottom % 2 === 0)
    ? index % 10
    : 9 - (index % 10);
  return { row: 9 - rowFromBottom, col };
}

function cellRect(row, col) {
  const size = canvas.clientWidth / 10;
  return { x: col * size, y: row * size, w: size, h: size };
}

/* ===============================
   TEXT RENDERING
=============================== */

function drawText(text, r) {
  if (!text) return;

  const padding = 6;
  const maxWidth = r.w - padding * 2;
  let fontSize = 12;

  while (fontSize >= 6) {
    ctx.font = `${fontSize}px system-ui`;

    const words = text.split(" ");
    let lines = [];
    let line = "";

    for (const w of words) {
      const test = line ? line + " " + w : w;
      if (ctx.measureText(test).width > maxWidth) {
        lines.push(line);
        line = w;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);

    const height = lines.length * fontSize;
    if (height <= r.h - 10) {
      const startY = r.y + (r.h - height) / 2;
      const cx = r.x + r.w / 2;

      ctx.textAlign = "center";
      ctx.fillStyle = "#000";

      lines.forEach((l, i) => {
        ctx.fillText(l, cx, startY + i * fontSize);
      });
      return;
    }

    fontSize--;
  }
}

/* ===============================
   DRAWING
=============================== */

// -------------------------------
// OFFSCREEN CONTENT LAYER
// -------------------------------
const contentLayer = document.createElement("canvas");
const contentCtx = contentLayer.getContext("2d");

// reusable tiny buffer for pixelation (avoid creating 100 canvases per frame)
const pixelBuf = document.createElement("canvas");
const pixelBufCtx = pixelBuf.getContext("2d");

// Call this inside resizeCanvas() (add these 2 lines there)
function resizeContentLayer() {
  const dpr = window.devicePixelRatio || 1;
  const size = canvas.clientWidth;

  contentLayer.width = size * dpr;
  contentLayer.height = size * dpr;

  // draw in CSS pixels
  contentCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  contentCtx.imageSmoothingEnabled = false;
  ctx.imageSmoothingEnabled = false;
}

// -------------------------------
// DRAW HELPERS (to a given context)
// -------------------------------
function drawTileTo(c, tilePath, r) {
  const img = getImage(tilePath);
  if (!img || !img.complete) return;

  const pad = r.w * 0.06;
  c.drawImage(img, r.x + pad, r.y + pad, r.w - 2 * pad, r.h - 2 * pad);
}

// Simple text renderer (no bold/italic). If you want styled text here,
// paste your styled drawText and I’ll convert it to drawTextTo exactly.
function drawTextTo(c, text, r) {
  if (!text) return;

  const padding = 6;
  const maxWidth = r.w - padding * 2;
  let fontSize = 12;

  c.fillStyle = "#000";
  c.textAlign = "center";
  c.textBaseline = "top";

  while (fontSize >= 6) {
    c.font = `${fontSize}px system-ui`;

    // Respect manual line breaks
    const paragraphs = text.split("\n");
    const lines = [];

    for (const para of paragraphs) {
      const words = para.split(" ");
      let line = "";

      for (const w of words) {
        const test = line ? line + " " + w : w;
        if (c.measureText(test).width > maxWidth) {
          if (line) lines.push(line);
          line = w;
        } else {
          line = test;
        }
      }
      if (line) lines.push(line);

      // small gap between paragraphs
      lines.push(""); // blank line marker
    }

    if (lines.length && lines[lines.length - 1] === "") lines.pop();

    const lineHeight = Math.round(fontSize * 1.1);
    const blockHeight = lines.length * lineHeight;

    if (blockHeight <= r.h - padding * 2) {
      const startY = r.y + (r.h - blockHeight) / 2;
      const cx = r.x + r.w / 2;

      lines.forEach((ln, i) => {
        if (ln === "") return; // paragraph gap (keeps it small)
        c.fillText(ln, cx, startY + i * lineHeight);
      });

      return;
    }

    fontSize--;
  }
}

// Placeholder spinner icon (tiny circle). Swap later for your image.
function drawSpinnerIconTo(c, r) {
  c.save();
  c.strokeStyle = "rgba(0,0,0,0.55)";
  c.lineWidth = 2;
  c.beginPath();
  c.arc(r.x + r.w * 0.2, r.y + r.h * 0.2, r.w * 0.08, 0, Math.PI * 2);
  c.stroke();
  c.restore();
}

// -------------------------------
// BUILD CONTENT LAYER (tiles + text + spinner icons)
// -------------------------------
function drawContentLayer() {
  const S = canvas.clientWidth;
  contentCtx.clearRect(0, 0, S, S);

  for (let n = 1; n <= 100; n++) {
    const { row, col } = squareToRowCol(n);
    const rect = cellRect(row, col);

    drawTileTo(contentCtx, tileBySquare[n], rect);
    if (squareInfo[n]) drawTextTo(contentCtx, squareInfo[n].text, rect);
    if (spinners[n]) drawSpinnerIconTo(contentCtx, rect);
  }
}

// -------------------------------
// PIXEL FOG (pixelate FROM content layer, not main canvas)
// -------------------------------
function drawFogPixelated(rect, d) {
  const strength = (d === 1) ? 8 : (d === 2) ? 14 : 22; // tweak to taste

  const w = Math.max(1, Math.floor(rect.w / strength));
  const h = Math.max(1, Math.floor(rect.h / strength));

  pixelBuf.width = w;
  pixelBuf.height = h;
  pixelBufCtx.imageSmoothingEnabled = false;

  // sample square region from content layer into tiny buffer
  pixelBufCtx.clearRect(0, 0, w, h);
  pixelBufCtx.drawImage(contentLayer, rect.x, rect.y, rect.w, rect.h, 0, 0, w, h);

  // draw back up onto main, pixelated
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(pixelBuf, 0, 0, w, h, rect.x, rect.y, rect.w, rect.h);

  // light veil so it feels foggy (optional)
  const veil = (d === 1) ? 0.10 : (d === 2) ? 0.18 : 0.25;
  ctx.fillStyle = `rgba(255,255,255,${veil})`;
  ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
}

// -------------------------------
// MAIN DRAW
// -------------------------------
function draw() {
  const S = canvas.clientWidth;
  ctx.clearRect(0, 0, S, S);

  // 1) crisp hand-drawn board + grid
  ctx.drawImage(board, 0, 0, S, S);

  // 2) build content once
  drawContentLayer();

  // 3) composite per-square
  for (let n = 1; n <= 100; n++) {
    const { row, col } = squareToRowCol(n);
    const rect = cellRect(row, col);

    // IMPORTANT: use your grid-aware distance(), not Math.abs(n - playerSquare)
    const d = distance(n, playerSquare);

    if (d <= 1) {
      // clear squares: copy content normally
      ctx.drawImage(contentLayer, rect.x, rect.y, rect.w, rect.h,
                    rect.x, rect.y, rect.w, rect.h);
    } else {
      // fog squares: pixelate content only
      drawFogPixelated(rect, d);
    }
  }

  drawToken();
}

function drawToken() {
  const { row, col } = squareToRowCol(playerSquare);
  const r = cellRect(row, col);

  ctx.beginPath();
  ctx.arc(r.x + r.w * 0.8, r.y + r.h * 0.2, r.w * 0.08, 0, Math.PI * 2);
  ctx.fillStyle = "red";
  ctx.fill();

  ctx.strokeStyle = "rgba(0,0,0,0.6)";
  ctx.lineWidth = 2;
  ctx.stroke();
}


/* ===============================
   INPUT
=============================== */

window.addEventListener("keydown", e => {
  if (e.key === " ") {
    e.preventDefault();

    playerSquare = Math.min(100, playerSquare + 1);   

    draw();
  }
});


/* ===============================
   INITIALISE
=============================== */

async function start() {
  resizeCanvas();
  await loadSquares();
  draw();
}

board.onload = start;
board.onerror = () => {
  console.warn("Board image failed to load — continuing anyway");
  start();
};

window.addEventListener("resize", () => {
  resizeCanvas();
  draw();
});
</script>
</body>
</html>
