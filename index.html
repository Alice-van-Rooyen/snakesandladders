<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Snakes Board</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e6e6e6;
    }

    canvas {
      width: 90vmin;
      height: 90vmin;
      background: #eee;
      border: 5px solid #000;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    }
  </style>
</head>

<body>
<canvas id="game"></canvas>

<script>
/* ===============================
   BASIC SETUP
=============================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const board = new Image();
board.src = "assets/board.png";

let playerSquare = 1;
let squareInfo = {};
let tileBySquare = {};

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const size = canvas.clientWidth;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function squareToRowCol(n) {
  const i = n - 1;
  const rowFromBottom = Math.floor(i / 10);
  const col = rowFromBottom % 2 === 0 ? i % 10 : 9 - (i % 10);
  return { row: 9 - rowFromBottom, col };
}

function cellRect(row, col) {
  const size = canvas.clientWidth / 10;
  return { x: col * size, y: row * size, w: size, h: size };
}

/* ===============================
   TEXT SCRAMBLER (THE MAGIC)
=============================== */

function scrambleText(text, seed) {
  let s = seed * 99991;
  const rand = () => (s = (s * 9301 + 49297) % 233280) / 233280;

  return [...text].map(ch => {
    if (/[a-z]/.test(ch)) return String.fromCharCode(97 + Math.floor(rand() * 26));
    if (/[A-Z]/.test(ch)) return String.fromCharCode(65 + Math.floor(rand() * 26));
    return ch;
  }).join("");
}

/* ===============================
   DRAW HELPERS
=============================== */

function drawText(text, rect, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = "#000";
  ctx.textAlign = "center";
  ctx.textBaseline = "top";

  let fontSize = 12;
  while (fontSize >= 6) {
    ctx.font = `${fontSize}px system-ui`;
    const lines = [];
    let line = "";

    for (const word of text.split(" ")) {
      const test = line ? line + " " + word : word;
      if (ctx.measureText(test).width > rect.w - 8) {
        lines.push(line);
        line = word;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);

    const height = lines.length * fontSize;
    if (height <= rect.h - 8) {
      const y0 = rect.y + (rect.h - height) / 2;
      lines.forEach((l, i) =>
        ctx.fillText(l, rect.x + rect.w / 2, y0 + i * fontSize)
      );
      ctx.restore();
      return;
    }
    fontSize--;
  }
  ctx.restore();
}

/* ===============================
   DRAW LOOP
=============================== */

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(board, 0, 0, canvas.width, canvas.height);

  for (let n = 1; n <= 100; n++) {
    const { row, col } = squareToRowCol(n);
    const r = cellRect(row, col);
    const d = Math.abs(n - playerSquare);

    const text = squareInfo[n]?.text;
    if (!text) continue;

    if (d <= 1) {
      // clear readable text
      drawText(text, r, 1);
    } else {
      // scrambled fog
      const scrambled = scrambleText(text, n);
      drawText(scrambled, r, 0.35);
    }
  }

  // draw player token
  const { row, col } = squareToRowCol(playerSquare);
  const r = cellRect(row, col);
  ctx.beginPath();
  ctx.arc(r.x + r.w * 0.8, r.y + r.h * 0.2, r.w * 0.08, 0, Math.PI * 2);
  ctx.fillStyle = "red";
  ctx.fill();
}

/* ===============================
   LOAD DATA
=============================== */

async function loadData() {
  const res = await fetch("data/squares.json");
  const data = await res.json();
  squareInfo = data.squares || {};
}

window.addEventListener("keydown", e => {
  if (e.key === " ") {
    playerSquare = Math.min(100, playerSquare + 1);
    draw();
  }
});

board.onload = async () => {
  resizeCanvas();
  await loadData();
  draw();
};

window.addEventListener("resize", () => {
  resizeCanvas();
  draw();
});
</script>
</body>
</html>
