<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Snakes Board</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e6e6e6;
    }

    canvas {
      width: 90vmin;
      height: 90vmin;
      background: #eee;
      border: 5px solid #000;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    }
  </style>
</head>

<body>
<canvas id="game"></canvas>

<script type="module">
/* ===============================
   CORE SETUP
=============================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const board = new Image();
board.src = "assets/board.png";

let showGrid = false;
let playerSquare = 1;
let logLines = [];

const imageCache = new Map();

/* ===============================
   HELPERS
=============================== */

function getImage(path) {
  if (!path) return null;
  if (imageCache.has(path)) return imageCache.get(path);
  const img = new Image();
  img.src = path;
  imageCache.set(path, img);
  return img;
}

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const size = canvas.clientWidth;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function distance(a, b) {
  const ra = squareToRowCol(a);
  const rb = squareToRowCol(b);
  return Math.abs(ra.row - rb.row) + Math.abs(ra.col - rb.col);
}

  
/* ===============================
   GAME DATA
=============================== */

let squareInfo = {};
let tileBySquare = {};
let spinners = {};

async function loadSquares() {
  const res = await fetch("data/squares.json");
  const data = await res.json();

  squareInfo = data.squares || {};
  spinners   = data.spinners || {};

  const defaultTile = data.tiles[data.defaultTile];
  tileBySquare = {};

  for (let i = 1; i <= 100; i++) tileBySquare[i] = defaultTile;

  for (const key in data.tileSets) {
    for (const n of data.tileSets[key]) {
      tileBySquare[n] = data.tiles[key];
    }
  }
}

/* ===============================
   GRID MATH
=============================== */

function squareToRowCol(n) {
  const index = n - 1;
  const rowFromBottom = Math.floor(index / 10);
  const col = (rowFromBottom % 2 === 0)
    ? index % 10
    : 9 - (index % 10);
  return { row: 9 - rowFromBottom, col };
}

function cellRect(row, col) {
  const size = canvas.clientWidth / 10;
  return { x: col * size, y: row * size, w: size, h: size };
}

/* ===============================
   TEXT RENDERING
=============================== */

function drawText(text, r) {
  if (!text) return;

  const padding = 6;
  const maxWidth = r.w - padding * 2;
  let fontSize = 12;

  while (fontSize >= 6) {
    ctx.font = `${fontSize}px system-ui`;

    const words = text.split(" ");
    let lines = [];
    let line = "";

    for (const w of words) {
      const test = line ? line + " " + w : w;
      if (ctx.measureText(test).width > maxWidth) {
        lines.push(line);
        line = w;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);

    const height = lines.length * fontSize;
    if (height <= r.h - 10) {
      const startY = r.y + (r.h - height) / 2;
      const cx = r.x + r.w / 2;

      ctx.textAlign = "center";
      ctx.fillStyle = "#000";

      lines.forEach((l, i) => {
        ctx.fillText(l, cx, startY + i * fontSize);
      });
      return;
    }

    fontSize--;
  }
}

/* ===============================
   DRAWING
=============================== */

function drawTile(tilePath, r) {
  const img = getImage(tilePath);
  if (!img || !img.complete) return;

  const pad = r.w * 0.06;
  ctx.drawImage(img, r.x + pad, r.y + pad, r.w - 2 * pad, r.h - 2 * pad);
}

function drawFog(r, distance) {
  let alpha;

  if (distance === 0) return;        // current square = clear
  if (distance === 1) alpha = 0.35;  // immediate neighbours
  else if (distance === 2) alpha = 0.65;
  else alpha = 0.85;                 // far away

  ctx.fillStyle = `rgba(255,255,255,${alpha})`;
  ctx.fillRect(r.x, r.y, r.w, r.h);
}


function draw() {
  const S = canvas.clientWidth;
  ctx.clearRect(0, 0, S, S);
  ctx.drawImage(board, 0, 0, S, S);

  for (let n = 1; n <= 100; n++) {
    const { row, col } = squareToRowCol(n);
    const rect = cellRect(row, col);

    // 1) draw tile
    drawTile(tileBySquare[n], rect);

    // 2) fog if not revealed
    const d = distance(n, playerSquare);
    drawFog(rect, d);

    // 3) draw text (revealed squares only)
    if (squareInfo[n]) drawText(squareInfo[n].text, rect);
  }

  drawToken();
}

function drawToken() {
  const { row, col } = squareToRowCol(playerSquare);
  const r = cellRect(row, col);

  ctx.beginPath();
  ctx.arc(r.x + r.w * 0.8, r.y + r.h * 0.2, r.w * 0.08, 0, Math.PI * 2);
  ctx.fillStyle = "red";
  ctx.fill();

  // optional outline so it stays visible on red/pink tiles
  ctx.strokeStyle = "rgba(0,0,0,0.6)";
  ctx.lineWidth = 2;
  ctx.stroke();
}


/* ===============================
   INPUT
=============================== */

window.addEventListener("keydown", e => {
  if (e.key === " ") {
    e.preventDefault();

    playerSquare = Math.min(100, playerSquare + 1);
    revealed.add(playerSquare);   

    draw();
  }
});


/* ===============================
   INITIALISE
=============================== */

async function start() {
  resizeCanvas();
  await loadSquares();
  draw();
}

board.onload = start;
window.addEventListener("resize", () => {
  resizeCanvas();
  draw();
});
</script>
</body>
</html>
