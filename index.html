<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Convalescent Snakes & Ladders</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e6e6e6;
    }

    canvas {
      width: 90vmin;
      height: 90vmin;
      background: #fff;
      border: 5px solid #000;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    }
  </style>
</head>

<body>
<canvas id="game"></canvas>

<script type="module">
/* ===============================
   CORE SETUP
=============================== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const board = new Image();
board.src = "assets/board.png";

const tokenImg = new Image();
tokenImg.src = "assets/token.png";

/* ===============================
   RENDER CONTROL (NEW)
=============================== */
let rafId = null;
let needsRender = true;

function invalidate() {
  needsRender = true;
  if (rafId === null) {
    rafId = requestAnimationFrame(tick);
  }
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    if (rafId !== null) cancelAnimationFrame(rafId);
    rafId = null;
  } else {
    invalidate();
  }
});

/* ===============================
   STATE
=============================== */
let playerSquare = 1;
let revealAll = false;
let showHelp = false;
let showMagnifier = false;

let tiles = {};
let textBySquare = {};
let popups = {};
let jumps = {};
let helpCopy = {};
let windows = {};

/* ===============================
   SCRAMBLE CACHE (NEW)
=============================== */
const scrambleCache = new Map();

function scrambleText(text, seed) {
  let s = seed * 99991;
  const rand = () => (s = (s * 9301 + 49297) % 233280) / 233280;

  return [...String(text)].map(ch => {
    if (/[a-z]/.test(ch)) return String.fromCharCode(97 + Math.floor(rand() * 26));
    if (/[A-Z]/.test(ch)) return String.fromCharCode(65 + Math.floor(rand() * 26));
    return ch;
  }).join("");
}

function getScrambled(text, n) {
  const key = `${n}::${text}`;
  if (!scrambleCache.has(key)) {
    scrambleCache.set(key, scrambleText(text, n));
  }
  return scrambleCache.get(key);
}

/* ===============================
   RICH TEXT CACHE (NEW)
=============================== */
const richLayoutCache = new Map();

function layoutRichText(text, maxWidth, fontSize) {
  ctx.font = `${fontSize}px system-ui`;
  const words = String(text).split(/\s+/);
  const lines = [];
  let line = "";

  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width <= maxWidth) {
      line = test;
    } else {
      if (line) lines.push({ type: "text", text: line });
      line = w;
    }
  }
  if (line) lines.push({ type: "text", text: line });
  return lines;
}

function getRichLayout(text, maxWidth, cellH) {
  const key = `${maxWidth}|${cellH}|${text}`;
  if (richLayoutCache.has(key)) return richLayoutCache.get(key);

  for (let fontSize = 12; fontSize >= 6; fontSize--) {
    const lines = layoutRichText(text, maxWidth, fontSize);
    const lineH = Math.round(fontSize * 1.1);
    const totalH = lines.length * lineH;
    if (totalH <= cellH - 12) {
      const obj = { fontSize, lines, lineH };
      richLayoutCache.set(key, obj);
      return obj;
    }
  }

  const fallback = {
    fontSize: 6,
    lines: layoutRichText(text, maxWidth, 6),
    lineH: 7
  };
  richLayoutCache.set(key, fallback);
  return fallback;
}

function drawRichText(text, r, alpha = 1) {
  if (!text) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = "#000";
  ctx.textAlign = "left";
  ctx.textBaseline = "top";

  const padding = 6;
  const maxWidth = r.w - padding * 2;
  const layout = getRichLayout(text, maxWidth, r.h);

  ctx.font = `${layout.fontSize}px system-ui`;
  let y = r.y + padding;
  for (const line of layout.lines) {
    ctx.fillText(line.text, r.x + padding, y);
    y += layout.lineH;
  }
  ctx.restore();
}

/* ===============================
   STATIC TETHER (SIMPLIFIED)
=============================== */
function drawTetherString() {
  const a = squareCornerAnchor(1, "br", 0.15);
  const b = tokenAnchor();

  ctx.save();
  ctx.strokeStyle = "#333";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
  ctx.restore();
}

/* ===============================
   DRAW
=============================== */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(board, 0, 0, canvas.width, canvas.height);

  drawTetherString();
  drawToken();

  for (let n = 1; n <= 100; n++) {
    const r = tileRect(n);
    const text = textBySquare[n];
    if (!text) continue;

    const visible = revealAll || n === playerSquare;
    const display = visible ? text : getScrambled(text, n);
    drawRichText(display, r);
  }
}

/* ===============================
   RAF TICK (NO IDLE LOOP)
=============================== */
function tick() {
  if (needsRender) {
    draw();
    needsRender = false;
  }
  rafId = null;
}

/* ===============================
   INPUT
=============================== */
window.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") {
    playerSquare = Math.min(100, playerSquare + 1);
    invalidate();
  }
});

/* ===============================
   CANVAS SIZE
=============================== */
function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const size = Math.min(window.innerWidth, window.innerHeight) * 0.9;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  richLayoutCache.clear();
  invalidate();
}

window.addEventListener("resize", resizeCanvas);

/* ===============================
   HELPERS (UNCHANGED ASSUMPTIONS)
=============================== */
function tileRect(n) {
  const s = canvas.width / 10;
  const row = Math.floor((n - 1) / 10);
  const col = (n - 1) % 10;
  return { x: col * s, y: (9 - row) * s, w: s, h: s };
}

function squareCornerAnchor(n, corner, frac) {
  const r = tileRect(n);
  return {
    x: r.x + r.w,
    y: r.y + r.h
  };
}

function tokenAnchor() {
  const r = tileRect(playerSquare);
  return { x: r.x + r.w / 2, y: r.y + r.h / 2 };
}

function drawToken() {
  const a = tokenAnchor();
  ctx.drawImage(tokenImg, a.x - 12, a.y - 12, 24, 24);
}

/* ===============================
   START
=============================== */
resizeCanvas();
invalidate();
</script>
</body>
</html>
