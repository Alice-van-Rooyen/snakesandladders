<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Snakes Board</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e6e6e6;
    }
    canvas {
      width: 90vmin;
      height: 90vmin;
      background: #eee;
      border: 5px solid #000;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    }
  </style>
</head>

<body>
  <canvas id="game"></canvas>

  <script type="module">
    /* ===============================
       CORE SETUP
    =============================== */

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // Offscreen content layer (tiles + text + spinner icons)
    const contentLayer = document.createElement("canvas");
    const contentCtx = contentLayer.getContext("2d");

    // Tiny reusable buffer for pixelation
    const pixelBuf = document.createElement("canvas");
    const pixelBufCtx = pixelBuf.getContext("2d");

    const board = new Image();
    board.src = "assets/board.png";

    let playerSquare = 1;

    const imageCache = new Map();

    /* ===============================
       HELPERS
    =============================== */

    function getImage(path) {
      if (!path) return null;
      if (imageCache.has(path)) return imageCache.get(path);
      const img = new Image();
      img.src = path;
      imageCache.set(path, img);
      return img;
    }

    function resizeAll() {
      const dpr = window.devicePixelRatio || 1;
      const size = canvas.clientWidth;

      // Main canvas
      canvas.width = Math.round(size * dpr);
      canvas.height = Math.round(size * dpr);

      // Content layer (same size)
      contentLayer.width = Math.round(size * dpr);
      contentLayer.height = Math.round(size * dpr);

      // Draw in CSS pixels
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      contentCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // Pixel look
      ctx.imageSmoothingEnabled = false;
      contentCtx.imageSmoothingEnabled = false;
      pixelBufCtx.imageSmoothingEnabled = false;
    }

    /* ===============================
       GAME DATA
    =============================== */

    let squareInfo = {};
    let tileBySquare = {};
    let spinners = {};

    async function loadSquares() {
      const res = await fetch("data/squares.json?v=" + Date.now());
      const data = await res.json();

      squareInfo = data.squares || {};
      spinners = data.spinners || {};

      const tiles = data.tiles || {};
      const defaultTilePath = tiles[data.defaultTile];

      tileBySquare = {};
      for (let i = 1; i <= 100; i++) tileBySquare[i] = defaultTilePath;

      const sets = data.tileSets || {};
      for (const key in sets) {
        const path = tiles[key];
        for (const n of sets[key]) tileBySquare[n] = path;
      }
    }

    /* ===============================
       GRID MATH
    =============================== */

    function squareToRowCol(n) {
      const index = n - 1;
      const rowFromBottom = Math.floor(index / 10);
      const col = (rowFromBottom % 2 === 0)
        ? index % 10
        : 9 - (index % 10);
      return { row: 9 - rowFromBottom, col };
    }

    function cellRect(row, col) {
      const cell = canvas.clientWidth / 10;
      return { x: col * cell, y: row * cell, w: cell, h: cell };
    }

    function distance(a, b) {
      const ra = squareToRowCol(a);
      const rb = squareToRowCol(b);
      return Math.abs(ra.row - rb.row) + Math.abs(ra.col - rb.col);
    }

    /* ===============================
       DRAW HELPERS (to a given ctx)
    =============================== */

    function drawTileTo(c, tilePath, r) {
      const img = getImage(tilePath);
      if (!img || !img.complete) return;

      const pad = r.w * 0.06;
      c.drawImage(img, r.x + pad, r.y + pad, r.w - 2 * pad, r.h - 2 * pad);
    }

    function drawTextTo(c, text, r) {
      if (!text) return;

      const padding = 6;
      const maxWidth = r.w - padding * 2;
      let fontSize = 12;

      c.fillStyle = "#000";
      c.textAlign = "center";
      c.textBaseline = "top";

      while (fontSize >= 6) {
        c.font = `${fontSize}px system-ui`;

        const paragraphs = text.split("\n");
        const lines = [];

        for (const para of paragraphs) {
          const words = para.split(" ");
          let line = "";

          for (const w of words) {
            const test = line ? line + " " + w : w;
            if (c.measureText(test).width > maxWidth) {
              if (line) lines.push(line);
              line = w;
            } else {
              line = test;
            }
          }
          if (line) lines.push(line);
          lines.push(""); // small paragraph gap marker
        }
        if (lines.length && lines[lines.length - 1] === "") lines.pop();

        const lineHeight = Math.round(fontSize * 1.1);
        const blockHeight = lines.length * lineHeight;

        if (blockHeight <= r.h - padding * 2) {
          const startY = r.y + (r.h - blockHeight) / 2;
          const cx = r.x + r.w / 2;

          lines.forEach((ln, i) => {
            if (ln === "") return; // keep paragraph gap small
            c.fillText(ln, cx, startY + i * lineHeight);
          });
          return;
        }

        fontSize--;
      }
    }

    function drawSpinnerIconTo(c, r) {
      // placeholder icon
      c.save();
      c.strokeStyle = "rgba(0,0,0,0.55)";
      c.lineWidth = 2;
      c.beginPath();
      c.arc(r.x + r.w * 0.2, r.y + r.h * 0.2, r.w * 0.08, 0, Math.PI * 2);
      c.stroke();
      c.restore();
    }

    /* ===============================
       BUILD CONTENT LAYER
    =============================== */

    function drawContentLayer() {
      const S = canvas.clientWidth;
      contentCtx.clearRect(0, 0, S, S);

      for (let n = 1; n <= 100; n++) {
        const { row, col } = squareToRowCol(n);
        const rect = cellRect(row, col);

        drawTileTo(contentCtx, tileBySquare[n], rect);
        if (squareInfo[n]) drawTextTo(contentCtx, squareInfo[n].text, rect);
        if (spinners[n]) drawSpinnerIconTo(contentCtx, rect);
      }
    }

    /* ===============================
       PIXEL FOG (pixelate content only)
    =============================== */

    function drawFogPixelated(rect, d) {
      const strength = (d === 1) ? 8 : (d === 2) ? 14 : 22;

      const w = Math.max(1, Math.floor(rect.w / strength));
      const h = Math.max(1, Math.floor(rect.h / strength));

      pixelBuf.width = w;
      pixelBuf.height = h;

      // Sample from content layer into tiny buffer
      pixelBufCtx.clearRect(0, 0, w, h);
      pixelBufCtx.drawImage(contentLayer, rect.x, rect.y, rect.w, rect.h, 0, 0, w, h);

      // Draw back up onto main canvas
      ctx.drawImage(pixelBuf, 0, 0, w, h, rect.x, rect.y, rect.w, rect.h);

      // light veil
      const veil = (d === 1) ? 0.10 : (d === 2) ? 0.18 : 0.25;
      ctx.fillStyle = `rgba(255,255,255,${veil})`;
      ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
    }

    /* ===============================
       MAIN DRAW
    =============================== */

    function draw() {
      const S = canvas.clientWidth;
      ctx.clearRect(0, 0, S, S);

      // Board image first (grid stays crisp)
      if (board.complete && board.naturalWidth) {
        ctx.drawImage(board, 0, 0, S, S);
      }

      // Build content (tiles+text+spinner icon) once per frame for now
      drawContentLayer();

      // Composite per-square
      for (let n = 1; n <= 100; n++) {
        const { row, col } = squareToRowCol(n);
        const rect = cellRect(row, col);

        const d = distance(n, playerSquare);

        if (d <= 1) {
          // visible: draw content clearly
          ctx.drawImage(contentLayer, rect.x, rect.y, rect.w, rect.h,
                        rect.x, rect.y, rect.w, rect.h);
        } else {
          // fog: pixelate content
          drawFogPixelated(rect, d);
        }
      }

      drawToken();
    }

    function drawToken() {
      const { row, col } = squareToRowCol(playerSquare);
      const r = cellRect(row, col);

      ctx.beginPath();
      ctx.arc(r.x + r.w * 0.8, r.y + r.h * 0.2, r.w * 0.08, 0, Math.PI * 2);
      ctx.fillStyle = "red";
      ctx.fill();

      ctx.strokeStyle = "rgba(0,0,0,0.6)";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    /* ===============================
       INPUT
    =============================== */

    window.addEventListener("keydown", e => {
      if (e.key === " ") {
        e.preventDefault();
        playerSquare = Math.min(100, playerSquare + 1);
        draw();
      }
    });

    /* ===============================
       STARTUP
    =============================== */

    async function start() {
      resizeAll();
      await loadSquares();
      draw();
    }

    board.onload = start;
    board.onerror = () => {
      console.warn("Board image failed to load — continuing anyway");
      start();
    };

    window.addEventListener("resize", () => {
      resizeAll();
      draw();
    });
  </script>
</body>
</html>
