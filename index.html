<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Snakes Board</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e6e6e6;
    }

    canvas {
      width: 90vmin;
      height: 90vmin;
      background: #fff;
      border: 5px solid #000;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      touch-action: manipulation;
      display: block;
    }
  </style>
</head>

<body>
  <canvas id="game"></canvas>

<script type="module">
/* ===============================
   CORE SETUP
=============================== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const board = new Image();
board.src = "assets/board.png";

const tokenImg = new Image();
tokenImg.src = "assets/token.png";

let playerSquare = 1;

// Visibility tuning
const AHEAD = 1;
const TRAIL_BEHIND = 6;
let visited = [1];

// Cheat reveal (typing "CHEAT")
let revealAll = false;

// Flash feedback when cheat toggles
let cheatFlashUntil = 0;
const CHEAT_FLASH_MS = 260;

// --- DATA LAYERS (separated) ---
let tileConfig = { defaultTile: "blue", tiles: {}, tileSets: {} }; // data/tiles.json
let squareText = {};                                               // data/text.json
let tileBySquare = {};

// Spinners (mechanics)
let spinnerMap = {};          // { from: [to,to,...] }
let spinnerSquares = new Set();

// Spinner art (optional)
let spinnerPins = {};         // { from: "path.png" }
let spinnerOutcomes = {};     // { from: { to: "path.png" } }

// Square substitution (replaces square text after landing delay)
let popupMap = {};               // { "36": { popup: "..." }, ... }
const shownSubstitutions = new Set(); // "36", "69" ... (once per load)
let substitutionArmed = null;     // { square, showAt }
let activeSubSquare = null;       // number or null
let activeSubText = "";           // string
const SUB_DELAY_MS = 520;         // tiny delay to let the original square be read

// Last resolved spinner outcome (for rotated outcome art)
let lastSpin = null;          // { from, to, t0, imgPath }
const SPIN_OUTCOME_MS = 900;

// Animation / interaction state
let rafId = null;
let inputLocked = false;

// Spin state
let spinActive = false;
let spinSquare = null;
let spinStartT = 0;
let spinDurationMs = 700;
let pendingJumpTo = null;

// Hospital pull + recall
const HOSPITAL_PULL_CHANCE = 0.03;
let recallSquare = null;
let recallExpiresAt = 0;
const RECALL_WINDOW_MS = 6000;

// Help overlay (JSON-driven)
let helpOpen = false;
const HELP_SEEN_KEY = "snakes_help_seen_v1";
let helpCopy = null; // data/help.json

// Tether dynamics
let stringJolt = 0;

// String styling
const STRING_COLOR = "rgba(184, 38, 60, 0.55)";
const STRING_KNOT_COLOR = "rgba(184, 38, 60, 0.85)";

// --- TUNING KNOBS (art-friendly) ---
let TOKEN_PAD_FRAC = 0.12;         // increase to lift token
let PIN_PAD_FRAC   = 0.10;         // hospital knot anchor
let RECALL_LABEL_X_FRAC = 0.14;    // move label left
let RECALL_LABEL_Y_FRAC = 0.08;    // smaller = lower label

// Image cache
const imageCache = new Map();
function getImage(path) {
  if (!path) return null;
  if (imageCache.has(path)) return imageCache.get(path);
  const img = new Image();
  img.src = path;
  imageCache.set(path, img);
  return img;
}

/* ===============================
   RESIZE
=============================== */
function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const size = canvas.clientWidth;

  canvas.width = Math.round(size * dpr);
  canvas.height = Math.round(size * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}

/* ===============================
   GRID MATH
=============================== */
function squareToRowCol(n) {
  const index = n - 1;
  const rowFromBottom = Math.floor(index / 10);
  const colInRow = index % 10;

  const row = 9 - rowFromBottom;
  const col = (rowFromBottom % 2 === 0) ? colInRow : 9 - colInRow;

  return { row, col };
}

function cellRect(row, col) {
  const S = canvas.clientWidth;
  const cell = S / 10;
  return { x: col * cell, y: row * cell, w: cell, h: cell };
}

function squareCornerAnchor(n, corner, padFrac) {
  const { row, col } = squareToRowCol(n);
  const r = cellRect(row, col);
  const pad = r.w * padFrac;

  if (corner === "bl") return { x: r.x + pad, y: r.y + r.h - pad, r };
  return { x: r.x + r.w - pad, y: r.y + r.h - pad, r }; // br
}

function squareCenter(n) {
  const { row, col } = squareToRowCol(n);
  const r = cellRect(row, col);
  return { x: r.x + r.w / 2, y: r.y + r.h / 2, r };
}

/* ===============================
   JSON LOADING
=============================== */
async function loadTiles() {
  const res = await fetch("data/tiles.json?v=" + Date.now());
  const data = await res.json();

  tileConfig = {
    defaultTile: data.defaultTile || "blue",
    tiles: data.tiles || {},
    tileSets: data.tileSets || {}
  };

  const defaultPath = tileConfig.tiles[tileConfig.defaultTile];

  tileBySquare = {};
  for (let n = 1; n <= 100; n++) tileBySquare[n] = defaultPath;

  for (const colourName of Object.keys(tileConfig.tileSets)) {
    const path = tileConfig.tiles[colourName];
    for (const n of (tileConfig.tileSets[colourName] || [])) {
      tileBySquare[n] = path;
    }
  }

  const uniquePaths = new Set(Object.values(tileBySquare).filter(Boolean));
  await preloadImages([...uniquePaths]);
}

async function loadText() {
  // Accept either:
  // 1) flat map: { "1":"...", "2":"..." }
  // 2) nested legacy: { "squares": { "1": { "text":"..." }, ... } }
  const res = await fetch("data/text.json?v=" + Date.now());
  const data = await res.json();

  if (data && typeof data === "object" && data.squares && typeof data.squares === "object") {
    const out = {};
    for (const [k, v] of Object.entries(data.squares)) {
      if (typeof v === "string") out[k] = v;
      else if (v && typeof v === "object" && typeof v.text === "string") out[k] = v.text;
    }
    squareText = out;
    return;
  }

  squareText = (data && typeof data === "object") ? data : {};
}

async function loadJumps() {
  try {
    const res = await fetch("data/jumps.json?v=" + Date.now());
    if (!res.ok) throw new Error("jumps.json not ok");
    const data = await res.json();

    spinnerMap = {};
    spinnerSquares = new Set();

    if (data.spinners && typeof data.spinners === "object") {
      for (const [k, arr] of Object.entries(data.spinners)) {
        const from = Number(k);
        if (!Number.isFinite(from) || from < 1 || from > 100) continue;

        const list = (Array.isArray(arr) ? arr : [arr])
          .map(Number)
          .filter(to => Number.isFinite(to) && to >= 1 && to <= 100 && to !== from);

        if (!list.length) continue;

        spinnerMap[from] = list;
        spinnerSquares.add(from);
      }
    }

    // Back-compat: { "jumps": { "4": 14 } }
    if (data.jumps && typeof data.jumps === "object") {
      for (const [k, v] of Object.entries(data.jumps)) {
        const from = Number(k);
        const to = Number(v);
        if (!Number.isFinite(from) || !Number.isFinite(to)) continue;
        if (from < 1 || from > 100 || to < 1 || to > 100) continue;
        if (from === to) continue;

        if (!spinnerMap[from]) {
          spinnerMap[from] = [to];
          spinnerSquares.add(from);
        }
      }
    }
  } catch {
    spinnerMap = {};
    spinnerSquares = new Set();
  }
}

async function loadHelpCopy() {
  try {
    const res = await fetch("data/help.json?v=" + Date.now());
    if (!res.ok) throw new Error("help.json not ok");
    helpCopy = await res.json();
  } catch {
    helpCopy = null;
  }
}

async function loadSpinnerArt() {
  // Optional: data/spinner_art.json
  try {
    const res = await fetch("data/spinner_art.json?v=" + Date.now());
    if (!res.ok) throw new Error("spinner_art.json not ok");
    const data = await res.json();

    spinnerPins = (data && typeof data.pins === "object") ? data.pins : {};
    spinnerOutcomes = (data && typeof data.outcomes === "object") ? data.outcomes : {};
  } catch {
    spinnerPins = {};
    spinnerOutcomes = {};
  }
}

async function loadPopups() {
  // Optional: data/popups.json
  // Format: { "36": { "popup": "..." }, ... }
  try {
    const res = await fetch("data/popups.json?v=" + Date.now());
    if (!res.ok) throw new Error("popups.json not ok");
    const data = await res.json();
    popupMap = (data && typeof data === "object") ? data : {};
  } catch {
    popupMap = {};
  }
}

function preloadImages(paths) {
  const promises = paths.map(p => new Promise(resolve => {
    const img = getImage(p);
    if (!img) return resolve();
    if (img.complete && img.naturalWidth > 0) return resolve();
    img.onload = () => resolve();
    img.onerror = () => resolve();
  }));
  return Promise.all(promises);
}

/* ===============================
   TILE
=============================== */
function drawTile(tilePath, r) {
  const img = getImage(tilePath);
  if (!img || !img.complete || img.naturalWidth === 0) return;

  const pad = r.w * 0.06;
  ctx.drawImage(img, r.x + pad, r.y + pad, r.w - 2 * pad, r.h - 2 * pad);
}

/* ===============================
   TEXT: fog + markdown-lite bold (**bold**)
=============================== */

// Deterministic scramble per square
function scrambleText(text, seed) {
  let s = seed * 99991;
  const rand = () => (s = (s * 9301 + 49297) % 233280) / 233280;

  return [...text].map(ch => {
    if (/[a-z]/.test(ch)) return String.fromCharCode(97 + Math.floor(rand() * 26));
    if (/[A-Z]/.test(ch)) return String.fromCharCode(65 + Math.floor(rand() * 26));
    return ch;
  }).join("");
}

function fogAlphaForSquare(n) {
  const d = Math.abs(n - playerSquare);
  const near = 0.55;
  const far  = 0.92;
  const start = 2;
  const end   = 20;
  const t = Math.max(0, Math.min(1, (d - start) / (end - start)));
  return near + (far - near) * t;
}

function fogVeilForSquare(n) {
  const d = Math.abs(n - playerSquare);
  const near = 0.06;
  const far  = 0.22;
  const start = 2;
  const end   = 20;
  const t = Math.max(0, Math.min(1, (d - start) / (end - start)));
  return near + (far - near) * t;
}

function parseBoldRuns(str) {
  // Markdown-lite: **bold**
  // Returns [{text, bold}, ...]
  const runs = [];
  let i = 0;
  let bold = false;

  while (i < str.length) {
    const j = str.indexOf("**", i);
    if (j === -1) {
      const tail = str.slice(i);
      if (tail) runs.push({ text: tail, bold });
      break;
    }
    const chunk = str.slice(i, j);
    if (chunk) runs.push({ text: chunk, bold });
    bold = !bold;
    i = j + 2;
  }

  // If odd number of **, we just treat trailing state as-is (good enough + predictable)
  return runs;
}

function setFont(fontSizePx, bold) {
  const weight = bold ? 800 : 400;
  ctx.font = `${weight} ${fontSizePx}px system-ui`;
}

function measureRunText(fontSizePx, bold, text) {
  setFont(fontSizePx, bold);
  return ctx.measureText(text).width;
}

function layoutRichText(text, maxWidth, fontSizePx) {
  // Supports manual line breaks and **bold** toggles.
  // Produces lines, each line is array of {text, bold}.
  const paragraphs = String(text).split("\n");
  const lines = [];

  for (let p = 0; p < paragraphs.length; p++) {
    const para = paragraphs[p];

    // Special case: empty paragraph -> gap
    if (para.trim() === "") {
      lines.push({ type: "gap" });
      continue;
    }

    const runs = parseBoldRuns(para);

    // Tokenise runs into words with bold flag, preserving spaces by re-adding a single space between words
    const tokens = [];
    for (const run of runs) {
      const parts = run.text.split(" ");
      for (let k = 0; k < parts.length; k++) {
        const w = parts[k];
        if (w === "" && parts.length > 1) continue;
        tokens.push({ text: w, bold: run.bold, isSpace: false });
        if (k < parts.length - 1) tokens.push({ text: " ", bold: run.bold, isSpace: true });
      }
    }

    // Wrap into lines
    let current = [];
    let currentW = 0;

    for (const tok of tokens) {
      const w = measureRunText(fontSizePx, tok.bold, tok.text);

      // Don't start a line with a space
      if (current.length === 0 && tok.isSpace) continue;

      if (currentW + w > maxWidth && current.length > 0) {
        // trim trailing spaces
        while (current.length && current[current.length - 1].isSpace) current.pop();
        lines.push({ type: "line", runs: current });

        current = [];
        currentW = 0;

        if (tok.isSpace) continue; // skip leading space on new line
      }

      current.push(tok);
      currentW += w;
    }

    // flush
    while (current.length && current[current.length - 1].isSpace) current.pop();
    if (current.length) lines.push({ type: "line", runs: current });

    // paragraph gap between paragraphs (but not after last)
    if (p < paragraphs.length - 1) lines.push({ type: "gap" });
  }

  // Remove trailing gap
  while (lines.length && lines[lines.length - 1].type === "gap") lines.pop();

  return lines;
}

function drawRichText(text, r, alpha = 1) {
  if (!text) return;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = "#000";
  ctx.textAlign = "left";
  ctx.textBaseline = "top";

  const padding = 6;
  const maxWidth = r.w - padding * 2;

  let fontSize = 12;
  while (fontSize >= 6) {
    const lines = layoutRichText(text, maxWidth, fontSize);

    const lineH = Math.round(fontSize * 1.15);
    const gapH  = Math.round(lineH * 0.45);
    const blockH = lines.reduce((h, item) => h + (item.type === "gap" ? gapH : lineH), 0);

    if (blockH <= r.h - padding * 2) {
      let y = r.y + (r.h - blockH) / 2;
      const cx = r.x + r.w / 2;

      for (const item of lines) {
        if (item.type === "gap") { y += gapH; continue; }

        // Measure full line width so we can center it
        let lineW = 0;
        for (const run of item.runs) {
          lineW += measureRunText(fontSize, run.bold, run.text);
        }

        let x = cx - lineW / 2;

        // Draw runs
        for (const run of item.runs) {
          setFont(fontSize, run.bold);
          ctx.fillText(run.text, x, y);
          x += ctx.measureText(run.text).width;
        }

        y += lineH;
      }

      ctx.restore();
      return;
    }

    fontSize--;
  }

  ctx.restore();
}

/* ===============================
   VISIBILITY (breadcrumb trail)
=============================== */
function recordMove(toSquare) {
  toSquare = Math.max(1, Math.min(100, toSquare));
  const step = (toSquare > playerSquare) ? 1 : -1;

  while (playerSquare !== toSquare) {
    playerSquare += step;
    visited.push(playerSquare);
  }

  if (visited.length > 500) visited = visited.slice(-250);
}

function getVisibleSet() {
  if (revealAll) {
    const all = new Set();
    for (let n = 1; n <= 100; n++) all.add(n);
    return all;
  }

  const vis = new Set();
  vis.add(1); // hospital always legible
  vis.add(playerSquare);

  for (let i = 1; i <= AHEAD; i++) vis.add(Math.min(100, playerSquare + i));

  for (let i = visited.length - 1; i >= 0 && vis.size < (2 + AHEAD + TRAIL_BEHIND); i--) {
    vis.add(visited[i]);
  }
  return vis;
}

/* ===============================
   SQUARE SUBSTITUTION (replaces square text after landing delay)
=============================== */
function getSubTextForSquare(n) {
  const entry = popupMap[String(n)];
  if (!entry || typeof entry !== "object") return null;
  const txt = entry.popup;
  if (typeof txt !== "string" || !txt.trim()) return null;
  return txt;
}

function clearActiveSubstitutionIfMoved() {
  if (activeSubSquare !== null && playerSquare !== activeSubSquare) {
    activeSubSquare = null;
    activeSubText = "";
  }
}

function maybeArmSubstitutionOnLanding(n, tNow) {
  // Only once per square per load
  if (shownSubstitutions.has(String(n))) return;

  // Must have substitution text
  const txt = getSubTextForSquare(n);
  if (!txt) return;

  // Already active/armed for this square
  if (activeSubSquare === n) return;
  if (substitutionArmed && substitutionArmed.square === n) return;

  substitutionArmed = { square: n, showAt: tNow + SUB_DELAY_MS };
}

function updateSubstitution(t) {
  clearActiveSubstitutionIfMoved();

  if (!substitutionArmed) return;

  // If moved away before it triggers, cancel
  if (playerSquare !== substitutionArmed.square) {
    substitutionArmed = null;
    return;
  }

  // Trigger
  if (t >= substitutionArmed.showAt) {
    const txt = getSubTextForSquare(substitutionArmed.square);
    if (txt) {
      activeSubSquare = substitutionArmed.square;
      activeSubText = txt;
      shownSubstitutions.add(String(substitutionArmed.square));
    }
    substitutionArmed = null;
  }
}

/* ===============================
   SPINNERS
=============================== */
function isSpinnerSquare(n) { return spinnerSquares.has(n); }

function randInt(maxExclusive) {
  if (maxExclusive <= 1) return 0;
  const c = globalThis.crypto;
  if (c && c.getRandomValues) {
    const buf = new Uint32Array(1);
    c.getRandomValues(buf);
    return buf[0] % maxExclusive;
  }
  return Math.floor(Math.random() * maxExclusive);
}

function chooseSpinnerDestination(fromSquare) {
  const options = spinnerMap[fromSquare];
  if (!options || options.length === 0) return null;
  return options[randInt(options.length)];
}

function drawSpinnerPin(n, rect, visible) {
  if (!spinnerSquares.has(n)) return;
  if (!visible) return;

  const path = spinnerPins[String(n)];
  if (!path) return;

  const img = getImage(path);
  if (!img || !img.complete || img.naturalWidth === 0) return;

  const size = rect.w * 0.72;
  const x = rect.x + rect.w * 0.14;
  const y = rect.y + rect.h * 0.14;

  ctx.save();
  ctx.globalAlpha = 0.95;
  ctx.drawImage(img, x, y, size, size);
  ctx.restore();
}

function drawSpinnerOutcome(t) {
  if (!lastSpin) return;

  const age = t - lastSpin.t0;
  if (age > SPIN_OUTCOME_MS) { lastSpin = null; return; }

  const from = squareCenter(lastSpin.from);
  const to = squareCenter(lastSpin.to);

  const dx = to.x - from.x;
  const dy = to.y - from.y;
  const angle = Math.atan2(dy, dx);

  const img = getImage(lastSpin.imgPath);
  if (!img || !img.complete || img.naturalWidth === 0) return;

  const p = Math.max(0, Math.min(1, age / SPIN_OUTCOME_MS));
  const fade = 1 - p;

  const size = from.r.w * 0.82;

  ctx.save();
  ctx.globalAlpha = 0.85 * fade;

  ctx.fillStyle = "rgba(255,255,255,0.18)";
  ctx.fillRect(from.r.x, from.r.y, from.r.w, from.r.h);

  ctx.translate(from.x, from.y);
  ctx.rotate(angle);
  ctx.rotate(Math.sin((t - lastSpin.t0) * 0.02) * 0.10 * fade);

  ctx.drawImage(img, -size/2, -size/2, size, size);
  ctx.restore();
}

/* ===============================
   HOSPITAL PULL + RECALL + HOME
=============================== */
function beginReturnToHospital(tNow, setRecall) {
  if (playerSquare !== 1 && setRecall) {
    recallSquare = playerSquare;
    recallExpiresAt = tNow + RECALL_WINDOW_MS;
  }

  spinActive = true;
  spinSquare = playerSquare;
  spinStartT = tNow;
  pendingJumpTo = 1;
  inputLocked = true;

  stringJolt = Math.min(1.2, stringJolt + 0.55);
}

function hospitalPullMaybe(tNow) {
  if (spinActive) return false;
  if (playerSquare === 1) return false;
  if (Math.random() >= HOSPITAL_PULL_CHANCE) return false;

  beginReturnToHospital(tNow, true);
  return true;
}

function goHome(tNow) {
  if (inputLocked) return;
  if (playerSquare === 1) return;
  beginReturnToHospital(tNow, true);
}

function canRecall(tNow) {
  if (!recallSquare) return false;
  if (tNow > recallExpiresAt) return false;
  if (playerSquare !== 1) return false;
  if (inputLocked) return false;
  return true;
}

function attemptRecall(tNow) {
  if (!canRecall(tNow)) return;

  const target = recallSquare;
  recallSquare = null;
  recallExpiresAt = 0;

  recordMove(target);
  stringJolt = Math.min(1.0, stringJolt + 0.35);

  startSpinIfNeeded(playerSquare);
  // arm substitution for landing square
  maybeArmSubstitutionOnLanding(playerSquare, tNow);
}

/* ===============================
   SPIN LOGIC
=============================== */
function startSpinIfNeeded(fromSquare) {
  if (!isSpinnerSquare(fromSquare)) return false;

  const to = chooseSpinnerDestination(fromSquare);
  if (!to || to === fromSquare) return false;

  spinActive = true;
  spinSquare = fromSquare;
  spinStartT = performance.now();
  pendingJumpTo = to;
  inputLocked = true;
  return true;
}

function drawSpinnerOverSquare(n, t) {
  if (!spinActive || spinSquare !== n) return;

  const { x, y, r } = squareCenter(n);
  const radius = r.w * 0.22;

  const p = Math.max(0, Math.min(1, (t - spinStartT) / spinDurationMs));
  const rot = (t - spinStartT) * 0.018;

  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = "#fff";
  ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.restore();

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);

  ctx.lineWidth = Math.max(2, r.w * 0.05);
  ctx.strokeStyle = "rgba(0,0,0,0.75)";
  ctx.lineCap = "round";

  const arcSpan = (Math.PI * 1.6) * (0.75 + 0.25 * (1 - p));
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, arcSpan);
  ctx.stroke();

  ctx.restore();
}

function updateSpin(t) {
  if (!spinActive) return;

  const elapsed = t - spinStartT;
  if (elapsed < spinDurationMs) return;

  spinActive = false;
  const to = pendingJumpTo;
  pendingJumpTo = null;

  const fromSquare = spinSquare;

  recordMove(to);
  stringJolt = Math.min(1.2, stringJolt + 0.45);

  const outcomeMap = spinnerOutcomes[String(fromSquare)] || null;
  const imgPath = outcomeMap ? outcomeMap[String(to)] : null;
  if (imgPath) lastSpin = { from: fromSquare, to, t0: t, imgPath };
  else lastSpin = null;

  if (!startSpinIfNeeded(playerSquare)) {
    inputLocked = false;
  }

  // arm substitution for landing square after spin resolves
  maybeArmSubstitutionOnLanding(playerSquare, t);
}

/* ===============================
   TOKEN (bottom-right)
=============================== */
function tokenAnchor(t) {
  const a = squareCornerAnchor(playerSquare, "br", TOKEN_PAD_FRAC);
  let cx = a.x;
  let cy = a.y;
  const r = a.r;

  if (spinActive) {
    const p = Math.max(0, Math.min(1, (t - spinStartT) / spinDurationMs));
    const amp = r.w * 0.06 * (1 - p);
    cx += Math.sin((t - spinStartT) * 0.05) * amp;
    cy += Math.cos((t - spinStartT) * 0.06) * amp;
  }

  return { x: cx, y: cy, r };
}

function drawToken(t) {
  const { x: cx, y: cy, r } = tokenAnchor(t);
  const size = r.w * 0.45;

  if (tokenImg.complete && tokenImg.naturalWidth > 0) {
    ctx.drawImage(tokenImg, cx - size / 2, cy - size / 2, size, size);
    ctx.strokeStyle = "rgba(0,0,0,0.55)";
    ctx.lineWidth = 2;
    ctx.strokeRect(cx - size / 2, cy - size / 2, size, size);
  } else {
    ctx.beginPath();
    ctx.arc(cx, cy, size / 2, 0, Math.PI * 2);
    ctx.fillStyle = "red";
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.55)";
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

/* ===============================
   TETHER STRING
=============================== */
function drawTetherString(t) {
  const a = squareCornerAnchor(1, "br", PIN_PAD_FRAC);
  const b = tokenAnchor(t);

  const wobbleAmp = (canvas.clientWidth / 10) * 0.07 * (0.25 + stringJolt);
  const segs = 14;

  ctx.save();
  ctx.lineWidth = Math.max(1, canvas.clientWidth * 0.0028);
  ctx.strokeStyle = STRING_COLOR;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  ctx.beginPath();
  ctx.moveTo(a.x, a.y);

  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;

  const px = -dy / len;
  const py = dx / len;

  const baseFreq = 6 + Math.min(10, len / 120);
  const phase = (t * 0.004) + (len * 0.002);

  for (let i = 1; i <= segs; i++) {
    const u = i / segs;
    const ease = Math.sin(Math.PI * u);

    const wx = px * Math.sin(phase + u * baseFreq) * wobbleAmp * ease;
    const wy = py * Math.sin(phase + u * baseFreq) * wobbleAmp * ease;

    const x = a.x + dx * u + wx;
    const y = a.y + dy * u + wy;
    ctx.lineTo(x, y);
  }

  ctx.stroke();

  ctx.fillStyle = STRING_KNOT_COLOR;
  ctx.beginPath();
  ctx.arc(a.x, a.y, Math.max(2, canvas.clientWidth * 0.0065), 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

/* ===============================
   HELP OVERLAY
=============================== */
function toggleHelp(open = !helpOpen) {
  helpOpen = !!open;
  if (helpOpen) {
    try { localStorage.setItem(HELP_SEEN_KEY, "1"); } catch {}
  }
}

function getHelpLines(tNow) {
  const secs = Math.round(RECALL_WINDOW_MS / 1000);

  if (helpCopy && Array.isArray(helpCopy.lines)) {
    const title = helpCopy.title || "Convalescent Snakes & Ladders — controls";
    const lines = helpCopy.lines.map(s => String(s).replaceAll("{RECALL_SECONDS}", String(secs)));
    return { title, lines };
  }

  return {
    title: "Convalescent Snakes & Ladders — controls",
    lines: [
      "→ / ↑  : forward 1 square",
      "← / ↓  : back 1 square",
      "Space  : forward 1 square",
      "Home / 1 : return to square 1",
      "",
      "⟳ Spinner squares: outcome is random.",
      "Hospital pull: sometimes you are snapped back to square 1.",
      `Recall: if pulled back, press R within ${secs}s to return.`,
      "",
      "Some squares rewrite themselves after you land on them.",
      "Type CHEAT : reveal entire board (toggle)",
      "Esc : close help, or return to jumbled board",
      "",
      "? : toggle this help"
    ]
  };
}

function drawHelpOverlay(t) {
  if (!helpOpen) return;

  const S = canvas.clientWidth;
  const pad = Math.max(16, S * 0.05);
  const boxW = S - pad * 2;
  const boxH = S - pad * 2;

  ctx.save();

  ctx.globalAlpha = 0.62;
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, S, S);

  ctx.globalAlpha = 0.96;
  ctx.fillStyle = "#fff";
  ctx.fillRect(pad, pad, boxW, boxH);

  ctx.globalAlpha = 0.9;
  ctx.strokeStyle = "rgba(0,0,0,0.65)";
  ctx.lineWidth = Math.max(2, S * 0.006);
  ctx.strokeRect(pad, pad, boxW, boxH);

  const { title, lines } = getHelpLines(t);
  const left = pad + Math.max(16, S * 0.05);
  const maxTextWidth = S * 0.75;
  let y = pad + Math.max(16, S * 0.05);

  const titleSize = Math.max(18, Math.round(S * 0.038));
  const bodySize  = Math.max(13, Math.round(S * 0.026));
  const lineGap   = Math.round(bodySize * 0.6);

  ctx.globalAlpha = 1;
  ctx.fillStyle = "rgba(0,0,0,0.92)";
  ctx.font = `700 ${titleSize}px system-ui`;
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
  ctx.fillText(title, left, y, maxTextWidth);
  y += titleSize * 1.4;

  ctx.fillStyle = "rgba(0,0,0,0.85)";
  ctx.font = `${bodySize}px system-ui`;

  for (const line of lines) {
    if (line === "") { y += bodySize * 0.9; continue; }
    ctx.fillText(line, left, y, maxTextWidth);
    y += bodySize + lineGap;
  }

  if (canRecall(t)) {
    y += bodySize * 0.6;
    ctx.fillStyle = "rgba(0,0,0,0.9)";
    ctx.font = `700 ${bodySize}px system-ui`;
    ctx.fillText("↩ Recall available now: press R.", left, y, maxTextWidth);
  }

  ctx.restore();
}

/* ===============================
   MAIN DRAW
=============================== */
function getSquareDisplayText(n) {
  // If substitution is active for this square, show it
  if (activeSubSquare === n && activeSubText) return activeSubText;

  // Otherwise show normal square text
  return squareText[String(n)] || "";
}

function draw(t) {
  const S = canvas.clientWidth;
  ctx.clearRect(0, 0, S, S);

  if (board.complete && board.naturalWidth > 0) {
    ctx.drawImage(board, 0, 0, S, S);
  }

  const visible = getVisibleSet();

  for (let n = 1; n <= 100; n++) {
    const { row, col } = squareToRowCol(n);
    const rect = cellRect(row, col);

    drawTile(tileBySquare[n], rect);
    drawSpinnerPin(n, rect, visible.has(n));

    const text = getSquareDisplayText(n);
    if (text) {
      if (n === 1 || visible.has(n)) {
        drawRichText(text, rect, 1);
      } else {
        const a = fogAlphaForSquare(n);
        drawRichText(scrambleText(text, n), rect, a);

        ctx.save();
        ctx.globalAlpha = fogVeilForSquare(n);
        ctx.fillStyle = "#fff";
        ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
        ctx.restore();
      }
    }

    drawSpinnerOverSquare(n, t);
  }

  drawTetherString(t);
  drawToken(t);
  drawSpinnerOutcome(t);

  // Recall hint
  if (canRecall(t)) {
    const pin = squareCornerAnchor(1, "br", PIN_PAD_FRAC);
    const x = pin.x - pin.r.w * RECALL_LABEL_X_FRAC;
    const y = pin.y - pin.r.w * RECALL_LABEL_Y_FRAC;
    const fontPx = Math.max(14, Math.round(pin.r.w * 0.24));

    ctx.save();
    ctx.font = `800 ${fontPx}px system-ui`;
    ctx.textAlign = "right";
    ctx.textBaseline = "bottom";

    ctx.lineWidth = Math.max(3, Math.round(fontPx * 0.18));
    ctx.strokeStyle = "rgba(0,0,0,0.85)";
    ctx.strokeText("↩ R", x, y);

    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.fillText("↩ R", x, y);

    ctx.restore();
  }

  // Flash feedback on CHEAT toggle
  if (t < cheatFlashUntil) {
    const remaining = cheatFlashUntil - t;
    const a = Math.max(0, Math.min(1, remaining / CHEAT_FLASH_MS));
    ctx.save();
    ctx.globalAlpha = 0.42 * a;
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, S, S);
    ctx.restore();
  }

  drawHelpOverlay(t);
}

/* ===============================
   MOVEMENT (1 square at a time)
=============================== */
function attemptStep(delta, tNow) {
  if (inputLocked) return;

  const next = Math.max(1, Math.min(100, playerSquare + delta));
  if (next === playerSquare) return;

  recordMove(next);
  stringJolt = Math.min(1.0, stringJolt + 0.25);

  // Arm substitution for landing square
  maybeArmSubstitutionOnLanding(playerSquare, tNow);

  // Spinner may override landing; substitution for spinner destination is armed in updateSpin()
  if (startSpinIfNeeded(playerSquare)) return;

  // Hospital pull
  hospitalPullMaybe(tNow);
}

/* ===============================
   INPUT
=============================== */

// CHEAT typing: type "CHEAT" quickly (window is max gap between letters)
let cheatBuffer = "";
let cheatLastT = 0;
const CHEAT_TIMEOUT_MS = 700;

function pushCheatChar(ch, tNow) {
  if (tNow - cheatLastT > CHEAT_TIMEOUT_MS) cheatBuffer = "";
  cheatLastT = tNow;

  cheatBuffer = (cheatBuffer + ch).slice(-5);

  if (cheatBuffer === "cheat") {
    revealAll = !revealAll;
    cheatFlashUntil = performance.now() + CHEAT_FLASH_MS;
    cheatBuffer = "";
    return true;
  }
  return false;
}

document.addEventListener("keydown", (e) => {
  const tNow = performance.now();

  const code = e.code || "";
  const rawKey = e.key || "";
  const key = String(rawKey || "").toLowerCase();

  // CHEAT typing has priority (no modifiers)
  if (key.length === 1 && "cheat".includes(key) && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const toggled = pushCheatChar(key, tNow);
    if (toggled) {
      e.preventDefault();
      return;
    }
  }

  // Help is only "?"
  const isHelp = (rawKey === "?"); // SHIFT+/ on most keyboards
  const isEsc = (code === "Escape" || key === "escape");

  const isRecall = (key === "r");
  const isHome = (code === "Home" || key === "home" || key === "1");

  const isSpace = (code === "Space") || (rawKey === " ") || (rawKey === "Spacebar");
  const isForward =
    (code === "ArrowRight") || (code === "ArrowUp") ||
    (rawKey === "ArrowRight") || (rawKey === "ArrowUp");

  const isBack =
    (code === "ArrowLeft") || (code === "ArrowDown") ||
    (rawKey === "ArrowLeft") || (rawKey === "ArrowDown");

  if (!(isHelp || isEsc || isRecall || isHome || isSpace || isForward || isBack)) return;
  e.preventDefault();

  if (isHelp) { toggleHelp(!helpOpen); return; }

  if (isEsc)  {
    if (helpOpen) { toggleHelp(false); return; }
    if (revealAll) { revealAll = false; return; } // return to jumbled/fog board
    return;
  }

  if (helpOpen) return;

  if (isHome) { goHome(tNow); return; }
  if (isRecall) { attemptRecall(tNow); return; }

  if (isBack) attemptStep(-1, tNow);
  else attemptStep(+1, tNow);
});

window.addEventListener("blur", () => {
  cheatBuffer = "";
  cheatLastT = 0;
});

/* ===============================
   TICK / LOOP
=============================== */
function tick(t) {
  stringJolt *= 0.92;
  if (stringJolt < 0.001) stringJolt = 0;

  updateSpin(t);
  updateSubstitution(t);
  draw(t);

  rafId = requestAnimationFrame(tick);
}

/* ===============================
   START
=============================== */
function maybeOpenHelpOnFirstVisit() {
  try {
    const seen = localStorage.getItem(HELP_SEEN_KEY);
    if (!seen) toggleHelp(true);
  } catch {
    toggleHelp(true);
  }
}

async function start() {
  resizeCanvas();

  try {
    await Promise.all([
      loadTiles(),
      loadText(),
      loadJumps(),
      loadHelpCopy(),
      loadSpinnerArt(),
      loadPopups()
    ]);
  } catch (err) {
    console.error("data failed to load:", err);
  }

  // Arm substitution if starting square has one (unlikely, but consistent)
  maybeArmSubstitutionOnLanding(playerSquare, performance.now());

  maybeOpenHelpOnFirstVisit();

  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(tick);
}

board.onload = start;
board.onerror = start;

window.addEventListener("resize", () => {
  resizeCanvas();
});

start();
</script>
