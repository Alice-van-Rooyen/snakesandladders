<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jumping snakes</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e6e6e6;
    }

    canvas {
      width: 90vmin;
      height: 90vmin;
      background: #fff;
      border: 5px solid #000;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      touch-action: manipulation;
    }
  </style>
</head>

<body>
  <canvas id="game"></canvas>

<script type="module">
/* ===============================
   CORE SETUP
=============================== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const board = new Image();
board.src = "assets/board.png";

const tokenImg = new Image();
tokenImg.src = "assets/token.png";

let playerSquare = 1;

// Visibility tuning
const AHEAD = 1;
const TRAIL_BEHIND = 6;  // “remember a week” vibe
let visited = [1];       // breadcrumb trail

// Game data
let squareInfo = {};     // { "1": {text, icon}, ... }
let tiles = {};          // { blue: "assets/tiles/blue.png", ... }
let tileSets = {};       // { pink: [..], ... }
let tileBySquare = {};   // { 1: "assets/tiles/blue.png", ... }

// Snakes & ladders jumps
// Expected data/jumps.json format (if present):
// { "jumps": { "4": 14, "17": 7, ... } }
let jumps = {};          // { 4: 14, ... } (numbers)
let jumpFromSet = new Set();

// Animation / interaction state
let rafId = null;
let lastT = 0;

let inputLocked = false;

// Spin (on landing) state
let spinActive = false;
let spinSquare = null;
let spinStartT = 0;
let spinDurationMs = 700;
let pendingJumpTo = null;

// Tether “string” dynamics
let stringJolt = 0;      // rises on movement, decays over time

// Image cache
const imageCache = new Map();
function getImage(path) {
  if (!path) return null;
  if (imageCache.has(path)) return imageCache.get(path);
  const img = new Image();
  img.src = path;
  imageCache.set(path, img);
  return img;
}

/* ===============================
   RESIZE
=============================== */
function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const size = canvas.clientWidth;

  canvas.width = Math.round(size * dpr);
  canvas.height = Math.round(size * dpr);

  // Draw using CSS pixels (0..size)
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}

/* ===============================
   GRID MATH
=============================== */
function squareToRowCol(n) {
  const index = n - 1;
  const rowFromBottom = Math.floor(index / 10);
  const colInRow = index % 10;

  const row = 9 - rowFromBottom;
  const col = (rowFromBottom % 2 === 0) ? colInRow : 9 - colInRow;

  return { row, col };
}

function cellRect(row, col) {
  const S = canvas.clientWidth;
  const cell = S / 10;
  return { x: col * cell, y: row * cell, w: cell, h: cell };
}

function squareCenter(n) {
  const { row, col } = squareToRowCol(n);
  const r = cellRect(row, col);
  return { x: r.x + r.w / 2, y: r.y + r.h / 2, r };
}

/* ===============================
   JSON LOADING
=============================== */
async function loadSquares() {
  const res = await fetch("data/squares.json?v=" + Date.now());
  const data = await res.json();

  squareInfo = data.squares || {};
  tiles = data.tiles || {};
  tileSets = data.tileSets || {};

  const defaultName = data.defaultTile || "blue";
  const defaultPath = tiles[defaultName];

  // Build tileBySquare for ALL 100 squares
  tileBySquare = {};
  for (let n = 1; n <= 100; n++) tileBySquare[n] = defaultPath;

  // Apply overrides
  for (const colourName of Object.keys(tileSets)) {
    const path = tiles[colourName];
    for (const n of (tileSets[colourName] || [])) {
      tileBySquare[n] = path;
    }
  }

  // Preload the unique tile images so we don’t get “only 3 squares”
  const uniquePaths = new Set(Object.values(tileBySquare).filter(Boolean));
  await preloadImages([...uniquePaths]);
}

async function loadJumps() {
  // Optional file. If absent, game still runs with no jumps.
  try {
    const res = await fetch("data/jumps.json?v=" + Date.now());
    if (!res.ok) throw new Error("jumps.json not ok");
    const data = await res.json();

    const raw = data.jumps || {};
    jumps = {};
    jumpFromSet = new Set();

    for (const [k, v] of Object.entries(raw)) {
      const from = Number(k);
      const to = Number(v);
      if (!Number.isFinite(from) || !Number.isFinite(to)) continue;
      if (from < 1 || from > 100 || to < 1 || to > 100) continue;
      if (from === to) continue;
      jumps[from] = to;
      jumpFromSet.add(from);
    }
  } catch (err) {
    jumps = {};
    jumpFromSet = new Set();
  }
}

function preloadImages(paths) {
  const promises = paths.map(p => new Promise(resolve => {
    const img = getImage(p);
    if (!img) return resolve();
    if (img.complete && img.naturalWidth > 0) return resolve();
    img.onload = () => resolve();
    img.onerror = () => resolve(); // don’t block everything on one missing tile
  }));
  return Promise.all(promises);
}

/* ===============================
   TILE + TEXT
=============================== */
function drawTile(tilePath, r) {
  const img = getImage(tilePath);
  if (!img || !img.complete || img.naturalWidth === 0) return;

  const pad = r.w * 0.06;
  ctx.drawImage(img, r.x + pad, r.y + pad, r.w - 2 * pad, r.h - 2 * pad);
}

// Deterministic scramble (cipher) per square number
function scrambleText(text, seed) {
  let s = seed * 99991;
  const rand = () => (s = (s * 9301 + 49297) % 233280) / 233280;

  return [...text].map(ch => {
    if (/[a-z]/.test(ch)) return String.fromCharCode(97 + Math.floor(rand() * 26));
    if (/[A-Z]/.test(ch)) return String.fromCharCode(65 + Math.floor(rand() * 26));
    return ch;
  }).join("");
}

function fogAlphaForSquare(n) {
  // distance along the path (works with your serpentine board numbering)
  const d = Math.abs(n - playerSquare);

  // Tune these:
  const near = 0.55; // opacity for squares just outside visible range
  const far  = 0.92; // opacity for very far squares

  // Start fogging only beyond your “visible” window:
  const start = 2;   // distance where fog begins
  const end   = 20;  // distance where fog reaches "far"

  const t = Math.max(0, Math.min(1, (d - start) / (end - start)));
  return near + (far - near) * t;
}

function fogVeilForSquare(n) {
  // Optional: a pale overlay to make the “sepsis haze” feel physical
  const d = Math.abs(n - playerSquare);
  const near = 0.06;
  const far  = 0.22;
  const start = 2;
  const end   = 20;

  const t = Math.max(0, Math.min(1, (d - start) / (end - start)));
  return near + (far - near) * t;
}

function drawText(text, r, alpha = 1) {
  if (!text) return;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = "#000";
  ctx.textAlign = "center";
  ctx.textBaseline = "top";

  const padding = 6;
  const maxWidth = r.w - padding * 2;

  let fontSize = 12;
  while (fontSize >= 6) {
    ctx.font = `${fontSize}px system-ui`;

    // support manual line breaks
    const paragraphs = text.split("\n");
    const lines = [];

    for (const para of paragraphs) {
      const words = para.split(" ");
      let line = "";

      for (const w of words) {
        const test = line ? `${line} ${w}` : w;
        if (ctx.measureText(test).width > maxWidth) {
          if (line) lines.push(line);
          line = w;
        } else {
          line = test;
        }
      }
      if (line) lines.push(line);
      lines.push({ type: "gap" });
    }
    if (lines.length && lines[lines.length - 1]?.type === "gap") lines.pop();

    const lineH = Math.round(fontSize * 1.1);
    const gapH  = Math.round(lineH * 0.35);

    const blockH = lines.reduce((h, item) => h + (item?.type === "gap" ? gapH : lineH), 0);

    if (blockH <= r.h - padding * 2) {
      let y = r.y + (r.h - blockH) / 2;
      const cx = r.x + r.w / 2;

      for (const item of lines) {
        if (item?.type === "gap") { y += gapH; continue; }
        ctx.fillText(item, cx, y);
        y += lineH;
      }

      ctx.restore();
      return;
    }

    fontSize--;
  }

  ctx.restore();
}

/* ===============================
   VISIBILITY (breadcrumb trail)
=============================== */
function recordMove(toSquare) {
  toSquare = Math.max(1, Math.min(100, toSquare));
  const step = (toSquare > playerSquare) ? 1 : -1;

  while (playerSquare !== toSquare) {
    playerSquare += step;
    visited.push(playerSquare);
  }

  // cap the history
  if (visited.length > 500) visited = visited.slice(-250);
}

function getVisibleSet() {
  const vis = new Set();

  // current
  vis.add(playerSquare);

  // ahead
  for (let i = 1; i <= AHEAD; i++) {
    vis.add(Math.min(100, playerSquare + i));
  }

  // behind: last N visited squares (works across row direction changes)
  for (let i = visited.length - 1; i >= 0 && vis.size < (1 + AHEAD + TRAIL_BEHIND); i--) {
    vis.add(visited[i]);
  }

  return vis;
}

/* ===============================
   PACK B — TETHER STRING
=============================== */
function drawTetherString(t) {
  const a = squareCenter(1);
  const b = tokenAnchor(t);

  // “Jolt” rises with movement, decays over time (handled in tick)
  const wobbleAmp = (canvas.clientWidth / 10) * 0.10 * (0.25 + stringJolt); // cell-based scaling
  const segs = 14;

  ctx.save();
  ctx.lineWidth = Math.max(2, canvas.clientWidth * 0.006);
  ctx.strokeStyle = "rgba(0,0,0,0.55)";
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  ctx.beginPath();
  ctx.moveTo(a.x, a.y);

  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;

  // Perpendicular unit vector for sideways wobble
  const px = -dy / len;
  const py = dx / len;

  // Frequency shifts slightly with distance and time
  const baseFreq = 6 + Math.min(10, len / 120);
  const phase = (t * 0.004) + (len * 0.002);

  for (let i = 1; i <= segs; i++) {
    const u = i / segs;
    // ease-in/out so ends feel “tied”
    const ease = Math.sin(Math.PI * u);

    const wx = px * Math.sin(phase + u * baseFreq) * wobbleAmp * ease;
    const wy = py * Math.sin(phase + u * baseFreq) * wobbleAmp * ease;

    const x = a.x + dx * u + wx;
    const y = a.y + dy * u + wy;

    ctx.lineTo(x, y);
  }

  ctx.stroke();

  // Small “knot” at square 1
  ctx.fillStyle = "rgba(0,0,0,0.7)";
  ctx.beginPath();
  ctx.arc(a.x, a.y, Math.max(2.5, canvas.clientWidth * 0.008), 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

/* ===============================
   PACK A — SPINNABLE SNAKES & LADDERS
=============================== */
function isJumpSquare(n) {
  return !!jumps[n];
}

function jumpDirectionGlyph(from, to) {
  // simple, asset-free cue
  return (to > from) ? "↗" : "↘";
}

function drawJumpHint(n, rect, visible) {
  if (!jumpFromSet.has(n)) return;
  if (!visible) return;

  const to = jumps[n];
  const glyph = jumpDirectionGlyph(n, to);

  ctx.save();
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = "rgba(0,0,0,0.7)";
  ctx.font = `${Math.max(10, Math.round(rect.w * 0.18))}px system-ui`;
  ctx.textAlign = "right";
  ctx.textBaseline = "top";
  ctx.fillText(glyph, rect.x + rect.w - rect.w * 0.08, rect.y + rect.h * 0.08);
  ctx.restore();
}

function startSpinIfNeeded(fromSquare) {
  const to = jumps[fromSquare];
  if (!to) return false;

  spinActive = true;
  spinSquare = fromSquare;
  spinStartT = performance.now();
  pendingJumpTo = to;
  inputLocked = true;
  return true;
}

function drawSpinnerOverSquare(n, t) {
  if (!spinActive || spinSquare !== n) return;

  const { x, y, r } = squareCenter(n);
  const radius = r.w * 0.22;

  const p = Math.max(0, Math.min(1, (t - spinStartT) / spinDurationMs));
  const rot = (t - spinStartT) * 0.018; // rotation speed

  // subtle “flash” behind spinner
  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = "#fff";
  ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.restore();

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);

  ctx.lineWidth = Math.max(2, r.w * 0.05);
  ctx.strokeStyle = "rgba(0,0,0,0.75)";
  ctx.lineCap = "round";

  // arc length tightens as spin completes
  const arcSpan = (Math.PI * 1.6) * (0.75 + 0.25 * (1 - p));
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, arcSpan);
  ctx.stroke();

  ctx.restore();
}

function updateSpin(t) {
  if (!spinActive) return;

  const elapsed = t - spinStartT;
  if (elapsed < spinDurationMs) return;

  // apply the jump
  spinActive = false;
  const to = pendingJumpTo;
  pendingJumpTo = null;

  // Important: we “teleport” after the spin, but we still record path steps between squares
  // (metaphor: you *do* move, but it isn’t linear or chosen).
  recordMove(to);

  // a bit more jolt after a jump
  stringJolt = Math.min(1.2, stringJolt + 0.45);

  // If chain jumps exist, allow them (rare but possible)
  if (!startSpinIfNeeded(playerSquare)) {
    inputLocked = false;
  }
}

/* ===============================
   TOKEN
=============================== */
function tokenAnchor(t) {
  const { row, col } = squareToRowCol(playerSquare);
  const r = cellRect(row, col);

  // Base token position within the cell
  let cx = r.x + r.w * 0.8;
  let cy = r.y + r.h * 0.2;

  // Wiggle while spinning (a little “uncertainty”)
  if (spinActive) {
    const p = Math.max(0, Math.min(1, (t - spinStartT) / spinDurationMs));
    const amp = r.w * 0.06 * (1 - p);
    cx += Math.sin((t - spinStartT) * 0.05) * amp;
    cy += Math.cos((t - spinStartT) * 0.06) * amp;
  }

  return { x: cx, y: cy, r };
}

function drawToken(t) {
  const { x: cx, y: cy, r } = tokenAnchor(t);
  const size = r.w * 0.45; // bigger token

  if (tokenImg.complete && tokenImg.naturalWidth > 0) {
    ctx.drawImage(tokenImg, cx - size / 2, cy - size / 2, size, size);
    ctx.strokeStyle = "rgba(0,0,0,0.55)";
    ctx.lineWidth = 2;
    ctx.strokeRect(cx - size / 2, cy - size / 2, size, size);
  } else {
    ctx.beginPath();
    ctx.arc(cx, cy, size / 2, 0, Math.PI * 2);
    ctx.fillStyle = "red";
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.55)";
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

/* ===============================
   MAIN DRAW
=============================== */
function draw(t) {
  const S = canvas.clientWidth;
  ctx.clearRect(0, 0, S, S);

  // board background (grid)
  if (board.complete && board.naturalWidth > 0) {
    ctx.drawImage(board, 0, 0, S, S);
  }

  const visible = getVisibleSet();

  for (let n = 1; n <= 100; n++) {
    const { row, col } = squareToRowCol(n);
    const rect = cellRect(row, col);

    // Always draw the tile for every square
    drawTile(tileBySquare[n], rect);

    // Jump hint (only when visible)
    drawJumpHint(n, rect, visible.has(n));

    // Text (if present)
    const entry = squareInfo[n];
    if (!entry || !entry.text) {
      // still draw spinner if this is the spin square
      drawSpinnerOverSquare(n, t);
      continue;
    }

    if (visible.has(n)) {
      drawText(entry.text, rect); // readable
    } else {
      const a = fogAlphaForSquare(n);
      drawText(scrambleText(entry.text, n), rect, a); // fog gradient

      // OPTIONAL: veil overlay
      ctx.save();
      ctx.globalAlpha = fogVeilForSquare(n);
      ctx.fillStyle = "#fff";
      ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
      ctx.restore();
    }

    // Spinner overlays above text/tile
    drawSpinnerOverSquare(n, t);
  }

  // PACK B: tether string under token, above board
  drawTetherString(t);

  drawToken(t);
}

/* ===============================
   MOVEMENT (1 square at a time)
=============================== */
function attemptStep(delta) {
  if (inputLocked) return;

  const next = Math.max(1, Math.min(100, playerSquare + delta));
  if (next === playerSquare) return;

  recordMove(next);

  // movement “jolt” for the tether
  stringJolt = Math.min(1.0, stringJolt + 0.25);

  // PACK A: if we landed on a jump square, spin then jump
  startSpinIfNeeded(playerSquare);
}

/* ===============================
   INPUT (arrow keys + space)
=============================== */
document.addEventListener("keydown", (e) => {
  const code = e.code || "";
  const key = e.key || "";

  const isSpace = (code === "Space") || (key === " ") || (key === "Spacebar");
  const isForward =
    (code === "ArrowRight") || (code === "ArrowUp") ||
    (key === "ArrowRight") || (key === "ArrowUp");

  const isBack =
    (code === "ArrowLeft") || (code === "ArrowDown") ||
    (key === "ArrowLeft") || (key === "ArrowDown");

  if (!(isSpace || isForward || isBack)) return;

  e.preventDefault();

  if (isBack) attemptStep(-1);
  else attemptStep(+1);
});

/* ===============================
   TICK / LOOP
=============================== */
function tick(t) {
  lastT = t;

  // decay tether energy
  stringJolt *= 0.92;
  if (stringJolt < 0.001) stringJolt = 0;

  // resolve spin -> jump when time elapsed
  updateSpin(t);

  draw(t);
  rafId = requestAnimationFrame(tick);
}

/* ===============================
   START
=============================== */
async function start() {
  resizeCanvas();

  try {
    await Promise.all([
      loadSquares(),
      loadJumps()
    ]);
  } catch (err) {
    console.error("data failed to load:", err);
  }

  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(tick);
}

// Ensure we start even if images fail
board.onload = start;
board.onerror = start;

// If token loads after start, the loop will draw it automatically
tokenImg.onload = () => {};
tokenImg.onerror = () => {};

window.addEventListener("resize", () => {
  resizeCanvas();
});

start();
</script>
</body>
</html>
