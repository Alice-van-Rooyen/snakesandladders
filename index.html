<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Board Prototype</title>
  <style>
    body {
      margin: 0;
      background: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      width: 90vmin;
      height: 90vmin;
      background: #f6f6f6;
      border: 5px solid #000;
    }
  </style>
</head>

<body>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const SIZE = 10;
const TILE_COUNT = 100;
const TILE_SIZE = () => canvas.width / 10;

const boardImage = new Image();
boardImage.src = "assets/board.png";

const tokenImg = new Image();
tokenImg.src = "assets/token.png";

let playerSquare = 1;

/* ---------- RESIZE ---------- */
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const size = Math.min(window.innerWidth, window.innerHeight);
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

/* ---------- GRID MATH ---------- */
function squareToRowCol(n) {
  const i = n - 1;
  const rowFromBottom = Math.floor(i / 10);
  const col = rowFromBottom % 2 === 0 ? i % 10 : 9 - (i % 10);
  return { row: 9 - rowFromBottom, col };
}

function cellRect(n) {
  const { row, col } = squareToRowCol(n);
  const s = canvas.width / 10;
  return { x: col * s, y: row * s, w: s, h: s };
}

/* ---------- FOG LOGIC ---------- */
function isVisible(n) {
  return Math.abs(n - playerSquare) <= 1;
}

function drawFog(rect, strength = 10) {
  const w = Math.max(1, Math.floor(rect.w / strength));
  const h = Math.max(1, Math.floor(rect.h / strength));

  const temp = document.createElement("canvas");
  temp.width = w;
  temp.height = h;
  const tctx = temp.getContext("2d");

  tctx.drawImage(
    canvas,
    rect.x, rect.y, rect.w, rect.h,
    0, 0, w, h
  );

  ctx.drawImage(temp, 0, 0, w, h, rect.x, rect.y, rect.w, rect.h);
  ctx.fillStyle = "rgba(255,255,255,0.25)";
  ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
}

/* ---------- DRAW LOOP ---------- */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(boardImage, 0, 0, canvas.width, canvas.height);

  for (let i = 1; i <= 100; i++) {
    const r = cellRect(i);
    if (!isVisible(i)) {
      drawFog(r);
    }
  }

  drawToken();
}

/* ---------- TOKEN ---------- */
function drawToken() {
  const r = cellRect(playerSquare);
  const size = r.w * 0.35;
  const cx = r.x + r.w * 0.8;
  const cy = r.y + r.h * 0.2;

  if (tokenImg.complete) {
    ctx.drawImage(tokenImg, cx - size/2, cy - size/2, size, size);
  } else {
    ctx.fillStyle = "red";
    ctx.beginPath();
    ctx.arc(cx, cy, size/2, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* ---------- INPUT ---------- */
window.addEventListener("keydown", e => {
  if (e.key === " ") {
    playerSquare = Math.min(100, playerSquare + 1);
    draw();
  }
});

/* ---------- START ---------- */
boardImage.onload = () => draw();
tokenImg.onload = () => draw();
</script>
</body>
</html>
