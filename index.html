<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Snakes Board</title>

  <style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #e6e6e6; /* light grey */
}

canvas {
  width: 90vmin;
  height: 90vmin;
  background: #eee;
  border: 5px solid #000;
  box-shadow: 0 8px 30px rgba(0,0,0,0.15);  
}

  </style>
</head>

<body>
  <canvas id="game"></canvas>

  <script type="module">

    // ===============================
    // 1. BASIC CANVAS SETUP
    // ===============================

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const board = new Image();
    board.src = "assets/board.png";

    let showGrid = false;

    const imageCache = new Map();

    function getImage(path) {
      if (!path) return null;
      if (imageCache.has(path)) return imageCache.get(path);

      const img = new Image();
      img.src = path;
      imageCache.set(path, img);
      return img;
    }

    
    window.addEventListener("keydown", (e) => {
    if (e.key.toLowerCase() === "g") {
    showGrid = !showGrid;
    draw();
    }
    });

    let WORLD_W = 1000;
    let WORLD_H = 1000;

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const cssSize = canvas.clientWidth;

      canvas.width = Math.round(cssSize * dpr);
      canvas.height = Math.round(cssSize * dpr);

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // ===============================
    // 2. LOAD THE JSON
    // ===============================

    let squareInfo = {};      // per-square text/icon
    let tileBySquare = {};    // per-square tile image path
    let tilePaths = {};       // name -> path (from JSON)

    async function loadSquares() {
      const res = await fetch("data/squares.json?v=" + Date.now());
      const data = await res.json();

    tilePaths = data.tiles;
    squareInfo = data.squares;

    // Start everything as the default colour:
      const defaultName = data.defaultTile;
      const defaultPath = tilePaths[defaultName];

    tileBySquare = {};
      for (let n = 1; n <= 100; n++) {
      tileBySquare[n] = defaultPath;
  }

    // Override with tileSets:
      const sets = data.tileSets || {};
        for (const colourName of Object.keys(sets)) {
        const path = tilePaths[colourName];
        const list = sets[colourName] || [];
        for (const n of list) {
          tileBySquare[n] = path;
    }
  }
}


    // ===============================
    // 3. SQUARE → ROW/COLUMN
    // ===============================

    function squareToRowCol(n) {
      const index = n - 1;
      const rowFromBottom = Math.floor(index / 10);
      const colInRow = index % 10;

      const row = 9 - rowFromBottom;
      const col = (rowFromBottom % 2 === 0)
        ? colInRow
        : 9 - colInRow;

      return { row, col };
    }

    function cellRect(row, col) {
      const S = canvas.clientWidth;
      const cell = S / 10;

      return {
        x: col * cell,
        y: row * cell,
        w: cell,
        h: cell
      };
    }



    // ===============================
    // 4. DRAW TEXT IN A SQUARE
    // ===============================

    function drawText(text, r) {
  if (!text) return;

  const padding = 6; // your preferred padding
  const maxWidth = r.w - padding * 2;
  let fontSize = 12;

  ctx.fillStyle = "#000";
  ctx.textAlign = "center";
  ctx.textBaseline = "top";

  while (fontSize >= 6) {
    ctx.font = fontSize + "px system-ui";

    const paragraphs = text.split("\n");
    const lines = [];

    for (const para of paragraphs) {
      const words = para.split(" ");
      let line = "";

      for (const word of words) {
        const test = line ? line + " " + word : word;
        if (ctx.measureText(test).width > maxWidth) {
          if (line) lines.push(line);
          line = word;
        } else {
          line = test;
        }
      }
      if (line) lines.push(line);

      // blank line between paragraphs
      lines.push("");
    }

    // remove last extra blank line
    if (lines[lines.length - 1] === "") {
      lines.pop();
    }

    const lineHeight = Math.round(fontSize * 1.1);
    const blockHeight = lines.length * lineHeight;

    if (blockHeight <= r.h - padding * 2) {
      const startY = r.y + (r.h - blockHeight) / 2;
      const centerX = r.x + r.w / 2;

      lines.forEach((ln, i) => {
        if (ln !== "") {
          ctx.fillText(ln, centerX, startY + i * lineHeight);
        }
      });
      return;
    }

    fontSize--;
  }

  // fallback: always show something
  ctx.font = "6px system-ui";
  ctx.fillText("…", r.x + r.w / 2, r.y + r.h / 2);
}



    // ===============================
    // 5. MAIN DRAW FUNCTION
    // ===============================

    function draw() {
      const S = canvas.clientWidth; // CSS pixels (visible size)
      ctx.clearRect(0, 0, S, S);
      ctx.drawImage(board, 0, 0, S, S);

    // Draw tiles + text for every square
      for (let n = 1; n <= 100; n++) {
        const entry = squareInfo[n]; // may be undefined if missing
        const { row, col } = squareToRowCol(n);
        const rect = cellRect(row, col);

    // 1) tile background (always present via default)
      drawTile(tileBySquare[n], rect);

    // 2) text (optional)
      if (entry) drawText(entry.text, rect);
  }

    // 3) debug grid on top
      if (showGrid) drawGridOverlay();
}


    // ===============================
    // 6. DRAW GRID FUNCTION
    // ===============================

    function drawGridOverlay() {
    const S = canvas.clientWidth;
    const cell = S / 10;

    ctx.strokeStyle = "red";
    ctx.lineWidth = 3;

    // vertical lines
    for (let i = 0; i <= 10; i++) {
      const x = i * cell;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, S);
      ctx.stroke();
    }

    // horizontal lines
    for (let i = 0; i <= 10; i++) {
      const y = i * cell;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(S, y);
      ctx.stroke();
    }
    }

    // ===============================
    // 7. DRAW TILES
    // ===============================

    function drawTile(tilePath, r) {
      const img = getImage(tilePath);
      if (!img || !img.complete) return;

      const pad = Math.max(2, r.w * 0.06); // ~6% gutter; tweak 0.06–0.12
      ctx.drawImage(img, r.x + pad, r.y + pad, r.w - 2 * pad, r.h - 2 * pad);
    }



    // ===============================
    // 8. START EVERYTHING
    // ===============================

    async function start() {
      resizeCanvas();
      await loadSquares();
      draw();
    }

    board.onload = start;
    window.addEventListener("resize", () => {
      resizeCanvas();
      draw();
    });


  </script>
</body>
</html>
