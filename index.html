<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Snakes Board</title>

  <style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #e6e6e6; /* light grey */
}

canvas {
  width: 90vmin;
  height: 90vmin;
  background: #eee;
  border: 5px solid #000;
  box-shadow: 0 8px 30px rgba(0,0,0,0.15);  
}

  </style>
</head>

<body>
  <canvas id="game"></canvas>

  <script type="module">

    // ===============================
    // 1. BASIC CANVAS SETUP
    // ===============================

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const board = new Image();
    board.src = "assets/board.png";

    let showGrid = false;

    window.addEventListener("keydown", (e) => {
    if (e.key.toLowerCase() === "g") {
    showGrid = !showGrid;
    draw();
    }
    });

    let WORLD_W = 1000;
    let WORLD_H = 1000;

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const cssSize = canvas.clientWidth;

      canvas.width = cssSize * dpr;
      canvas.height = cssSize * dpr;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // ===============================
    // 2. LOAD THE JSON
    // ===============================

    let squares = {};

    async function loadSquares() {
      const res = await fetch("data/squares.json?v=" + Date.now());
      squares = await res.json();
    }

    // ===============================
    // 3. SQUARE → ROW/COLUMN
    // ===============================

    function squareToRowCol(n) {
      const index = n - 1;
      const rowFromBottom = Math.floor(index / 10);
      const colInRow = index % 10;

      const row = 9 - rowFromBottom;
      const col = (rowFromBottom % 2 === 0)
        ? colInRow
        : 9 - colInRow;

      return { row, col };
    }

    function cellRect(row, col) {
      const S = canvas.clientWidth;
      const cell = S / 10;

      return {
        x: col * cell,
        y: row * cell,
        w: cell,
        h: cell
      };
    }



    // ===============================
    // 4. DRAW TEXT IN A SQUARE
    // ===============================

    function drawText(text, r) {
      if (!text) return;

      const padding = 6;
      const maxWidth = r.w - padding * 2;
      let fontSize = 14;

      ctx.fillStyle = "#000";
      ctx.textBaseline = "top";

      while (fontSize > 8) {
        ctx.font = fontSize + "px system-ui";
        const words = text.split(" ");
        let lines = [];
        let line = "";

        for (const word of words) {
          const test = line + word + " ";
          if (ctx.measureText(test).width > maxWidth) {
            lines.push(line);
            line = word + " ";
          } else {
            line = test;
          }
        }
        lines.push(line);

        if (lines.length * fontSize <= r.h - padding * 2) {
          lines.forEach((ln, i) => {
            ctx.fillText(
              ln,
              r.x + padding,
              r.y + padding + i * fontSize
            );
          });
          return;
        }
        fontSize--;
      }
    }

    // ===============================
    // 5. MAIN DRAW FUNCTION
    // ===============================

    function draw() {
      const S = canvas.clientWidth;          // CSS pixels (the visible size)
      ctx.clearRect(0, 0, S, S);
      ctx.drawImage(board, 0, 0, S, S);       // draw board to fit canvas
      if (showGrid) drawGridOverlay();


      for (let n = 1; n <= 100; n++) {
        const entry = squares[n];
        if (!entry) continue;

        const { row, col } = squareToRowCol(n);
        const rect = cellRect(row, col);

        drawText(entry.text, rect);
      }
    }

    // ===============================
    // 6. DRAW GRID FUNCTION
    // ===============================

    function drawGridOverlay() {
    const S = canvas.clientWidth;
    const cell = S / 10;

    ctx.strokeStyle = "red";
    ctx.lineWidth = 3;

    // vertical lines
    for (let i = 0; i <= 10; i++) {
      const x = i * cell;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, S);
      ctx.stroke();
    }

    // horizontal lines
    for (let i = 0; i <= 10; i++) {
      const y = i * cell;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(S, y);
      ctx.stroke();
    }
    }


    // ===============================
    // 7. START EVERYTHING
    // ===============================

    async function start() {
      resizeCanvas();
      await loadSquares();
      draw();
    }

    board.onload = start;
    window.addEventListener("resize", resizeCanvas);

  </script>
</body>
</html>
