<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>alice is excited</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e6e6e6;
    }

    canvas {
      width: 90vmin;
      height: 90vmin;
      background: #fff;
      border: 5px solid #000;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      touch-action: manipulation;
    }
  </style>
</head>

<body>
  <canvas id="game"></canvas>

<script type="module">
/* ===============================
   CORE SETUP
=============================== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const board = new Image();
board.src = "assets/board.png";

const tokenImg = new Image();
tokenImg.src = "assets/token.png";

let playerSquare = 1;

// Visibility tuning
const AHEAD = 1;
const TRAIL_BEHIND = 6;  // “remember a week” vibe
let visited = [1];       // breadcrumb trail

// Game data
let squareInfo = {};     // { "1": {text, icon}, ... }
let tiles = {};          // { blue: "assets/tiles/blue.png", ... }
let tileSets = {};       // { pink: [..], ... }
let tileBySquare = {};   // { 1: "assets/tiles/blue.png", ... }

// Spinnable snakes & ladders (random outcomes)
// Supported data/jumps.json formats:
//
// NEW (recommended):
// { "spinners": { "4": [14, 2, 27], "9": [3, 18] } }
//
// Back-compat (single fixed jump):
// { "jumps": { "4": 14, "9": 2 } }
let spinnerMap = {};     // { 4: [14,2,27], ... }
let spinnerSquares = new Set();

// Animation / interaction state
let rafId = null;
let inputLocked = false;

// Spin (on landing) state (used for both spinners + “hospital pull”)
let spinActive = false;
let spinSquare = null;
let spinStartT = 0;
let spinDurationMs = 700;
let pendingJumpTo = null;

// “Hospital pull” (occasional snap-back to square 1)
const HOSPITAL_PULL_CHANCE = 0.03; // 3% chance on each landing (tweak to taste)
let lastSafeSquare = 1;            // last non-1 square you were on before a pull
let recallSquare = null;           // can attempt to return to this
let recallExpiresAt = 0;           // memory window (ms epoch from performance.now)
const RECALL_WINDOW_MS = 6000;     // “if you can remember it”

// Help overlay state (Pack: ? overlay)
let helpOpen = false;
const HELP_SEEN_KEY = "snakes_help_seen_v1";

// Tether “string” dynamics
let stringJolt = 0;

// String styling (lighter + thinner + string-like)
const STRING_COLOR = "rgba(184, 38, 60, 0.55)"; // soft red string
const STRING_KNOT_COLOR = "rgba(184, 38, 60, 0.85)";

// Image cache
const imageCache = new Map();
function getImage(path) {
  if (!path) return null;
  if (imageCache.has(path)) return imageCache.get(path);
  const img = new Image();
  img.src = path;
  imageCache.set(path, img);
  return img;
}

/* ===============================
   RESIZE
=============================== */
function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const size = canvas.clientWidth;

  canvas.width = Math.round(size * dpr);
  canvas.height = Math.round(size * dpr);

  // Draw using CSS pixels (0..size)
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}

/* ===============================
   GRID MATH
=============================== */
function squareToRowCol(n) {
  const index = n - 1;
  const rowFromBottom = Math.floor(index / 10);
  const colInRow = index % 10;

  const row = 9 - rowFromBottom;
  const col = (rowFromBottom % 2 === 0) ? colInRow : 9 - colInRow;

  return { row, col };
}

function cellRect(row, col) {
  const S = canvas.clientWidth;
  const cell = S / 10;
  return { x: col * cell, y: row * cell, w: cell, h: cell };
}

function squareCornerAnchor(n, corner /* "br" | "bl" */) {
  const { row, col } = squareToRowCol(n);
  const r = cellRect(row, col);
  const pad = r.w * 0.10;

  if (corner === "bl") {
    return { x: r.x + pad, y: r.y + r.h - pad, r };
  }
  // default "br"
  return { x: r.x + r.w - pad, y: r.y + r.h - pad, r };
}

function squareCenter(n) {
  const { row, col } = squareToRowCol(n);
  const r = cellRect(row, col);
  return { x: r.x + r.w / 2, y: r.y + r.h / 2, r };
}

/* ===============================
   JSON LOADING
=============================== */
async function loadSquares() {
  const res = await fetch("data/squares.json?v=" + Date.now());
  const data = await res.json();

  squareInfo = data.squares || {};
  tiles = data.tiles || {};
  tileSets = data.tileSets || {};

  const defaultName = data.defaultTile || "blue";
  const defaultPath = tiles[defaultName];

  // Build tileBySquare for ALL 100 squares
  tileBySquare = {};
  for (let n = 1; n <= 100; n++) tileBySquare[n] = defaultPath;

  // Apply overrides
  for (const colourName of Object.keys(tileSets)) {
    const path = tiles[colourName];
    for (const n of (tileSets[colourName] || [])) {
      tileBySquare[n] = path;
    }
  }

  // Preload the unique tile images so we don’t get “only 3 squares”
  const uniquePaths = new Set(Object.values(tileBySquare).filter(Boolean));
  await preloadImages([...uniquePaths]);
}

async function loadJumps() {
  // Optional file. If absent, game still runs with no spinners.
  try {
    const res = await fetch("data/jumps.json?v=" + Date.now());
    if (!res.ok) throw new Error("jumps.json not ok");
    const data = await res.json();

    spinnerMap = {};
    spinnerSquares = new Set();

    // NEW format: spinners: { "from": [to1,to2,...] }
    if (data.spinners && typeof data.spinners === "object") {
      for (const [k, arr] of Object.entries(data.spinners)) {
        const from = Number(k);
        if (!Number.isFinite(from) || from < 1 || from > 100) continue;

        const list = (Array.isArray(arr) ? arr : [arr])
          .map(Number)
          .filter(to => Number.isFinite(to) && to >= 1 && to <= 100 && to !== from);

        if (list.length === 0) continue;

        spinnerMap[from] = list;
        spinnerSquares.add(from);
      }
    }

    // Back-compat: jumps: { "from": to }
    if (data.jumps && typeof data.jumps === "object") {
      for (const [k, v] of Object.entries(data.jumps)) {
        const from = Number(k);
        const to = Number(v);
        if (!Number.isFinite(from) || !Number.isFinite(to)) continue;
        if (from < 1 || from > 100 || to < 1 || to > 100) continue;
        if (from === to) continue;

        if (!spinnerMap[from]) {
          spinnerMap[from] = [to];
          spinnerSquares.add(from);
        }
      }
    }
  } catch (err) {
    spinnerMap = {};
    spinnerSquares = new Set();
  }
}

function preloadImages(paths) {
  const promises = paths.map(p => new Promise(resolve => {
    const img = getImage(p);
    if (!img) return resolve();
    if (img.complete && img.naturalWidth > 0) return resolve();
    img.onload = () => resolve();
    img.onerror = () => resolve();
  }));
  return Promise.all(promises);
}

/* ===============================
   TILE + TEXT
=============================== */
function drawTile(tilePath, r) {
  const img = getImage(tilePath);
  if (!img || !img.complete || img.naturalWidth === 0) return;

  const pad = r.w * 0.06;
  ctx.drawImage(img, r.x + pad, r.y + pad, r.w - 2 * pad, r.h - 2 * pad);
}

// Deterministic scramble (cipher) per square number
function scrambleText(text, seed) {
  let s = seed * 99991;
  const rand = () => (s = (s * 9301 + 49297) % 233280) / 233280;

  return [...text].map(ch => {
    if (/[a-z]/.test(ch)) return String.fromCharCode(97 + Math.floor(rand() * 26));
    if (/[A-Z]/.test(ch)) return String.fromCharCode(65 + Math.floor(rand() * 26));
    return ch;
  }).join("");
}

function fogAlphaForSquare(n) {
  const d = Math.abs(n - playerSquare);
  const near = 0.55;
  const far  = 0.92;
  const start = 2;
  const end   = 20;
  const t = Math.max(0, Math.min(1, (d - start) / (end - start)));
  return near + (far - near) * t;
}

function fogVeilForSquare(n) {
  const d = Math.abs(n - playerSquare);
  const near = 0.06;
  const far  = 0.22;
  const start = 2;
  const end   = 20;
  const t = Math.max(0, Math.min(1, (d - start) / (end - start)));
  return near + (far - near) * t;
}

function drawText(text, r, alpha = 1) {
  if (!text) return;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = "#000";
  ctx.textAlign = "center";
  ctx.textBaseline = "top";

  const padding = 6;
  const maxWidth = r.w - padding * 2;

  let fontSize = 12;
  while (fontSize >= 6) {
    ctx.font = `${fontSize}px system-ui`;

    const paragraphs = text.split("\n");
    const lines = [];

    for (const para of paragraphs) {
      const words = para.split(" ");
      let line = "";

      for (const w of words) {
        const test = line ? `${line} ${w}` : w;
        if (ctx.measureText(test).width > maxWidth) {
          if (line) lines.push(line);
          line = w;
        } else {
          line = test;
        }
      }
      if (line) lines.push(line);
      lines.push({ type: "gap" });
    }
    if (lines.length && lines[lines.length - 1]?.type === "gap") lines.pop();

    const lineH = Math.round(fontSize * 1.1);
    const gapH  = Math.round(lineH * 0.35);
    const blockH = lines.reduce((h, item) => h + (item?.type === "gap" ? gapH : lineH), 0);

    if (blockH <= r.h - padding * 2) {
      let y = r.y + (r.h - blockH) / 2;
      const cx = r.x + r.w / 2;

      for (const item of lines) {
        if (item?.type === "gap") { y += gapH; continue; }
        ctx.fillText(item, cx, y);
        y += lineH;
      }

      ctx.restore();
      return;
    }

    fontSize--;
  }

  ctx.restore();
}

/* ===============================
   VISIBILITY (breadcrumb trail)
=============================== */
function recordMove(toSquare) {
  toSquare = Math.max(1, Math.min(100, toSquare));
  const step = (toSquare > playerSquare) ? 1 : -1;

  while (playerSquare !== toSquare) {
    playerSquare += step;
    visited.push(playerSquare);
  }

  if (visited.length > 500) visited = visited.slice(-250);
}

function getVisibleSet() {
  const vis = new Set();

  // Square 1 is ALWAYS visible + legible (“still attached to hospital”)
  vis.add(1);

  // current
  vis.add(playerSquare);

  // ahead
  for (let i = 1; i <= AHEAD; i++) {
    vis.add(Math.min(100, playerSquare + i));
  }

  // behind: last N visited squares
  for (let i = visited.length - 1; i >= 0 && vis.size < (2 + AHEAD + TRAIL_BEHIND); i--) {
    vis.add(visited[i]);
  }

  return vis;
}

/* ===============================
   PACK B — TETHER STRING
=============================== */
function drawTetherString(t) {
  // Pin is bottom-right of square 1
  const a = squareCornerAnchor(1, "br");
  const b = tokenAnchor(t);

  const wobbleAmp = (canvas.clientWidth / 10) * 0.07 * (0.25 + stringJolt);
  const segs = 14;

  ctx.save();
  ctx.lineWidth = Math.max(1, canvas.clientWidth * 0.0028);
  ctx.strokeStyle = STRING_COLOR;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  ctx.beginPath();
  ctx.moveTo(a.x, a.y);

  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const len = Math.hypot(dx, dy) || 1;

  const px = -dy / len;
  const py = dx / len;

  const baseFreq = 6 + Math.min(10, len / 120);
  const phase = (t * 0.004) + (len * 0.002);

  for (let i = 1; i <= segs; i++) {
    const u = i / segs;
    const ease = Math.sin(Math.PI * u);

    const wx = px * Math.sin(phase + u * baseFreq) * wobbleAmp * ease;
    const wy = py * Math.sin(phase + u * baseFreq) * wobbleAmp * ease;

    const x = a.x + dx * u + wx;
    const y = a.y + dy * u + wy;

    ctx.lineTo(x, y);
  }

  ctx.stroke();

  // Knot at square 1
  ctx.fillStyle = STRING_KNOT_COLOR;
  ctx.beginPath();
  ctx.arc(a.x, a.y, Math.max(2, canvas.clientWidth * 0.0065), 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

/* ===============================
   PACK A — SPINNABLE SNAKES & LADDERS (random)
=============================== */
function isSpinnerSquare(n) {
  return spinnerSquares.has(n);
}

function drawSpinnerHint(n, rect, visible) {
  if (!isSpinnerSquare(n)) return;
  if (!visible) return;

  ctx.save();
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = "rgba(0,0,0,0.7)";
  ctx.font = `${Math.max(11, Math.round(rect.w * 0.18))}px system-ui`;
  ctx.textAlign = "right";
  ctx.textBaseline = "top";
  ctx.fillText("⟳", rect.x + rect.w - rect.w * 0.08, rect.y + rect.h * 0.08);
  ctx.restore();
}

function randInt(maxExclusive) {
  if (maxExclusive <= 1) return 0;
  const c = globalThis.crypto;
  if (c && c.getRandomValues) {
    const buf = new Uint32Array(1);
    c.getRandomValues(buf);
    return buf[0] % maxExclusive;
  }
  return Math.floor(Math.random() * maxExclusive);
}

function chooseSpinnerDestination(fromSquare) {
  const options = spinnerMap[fromSquare];
  if (!options || options.length === 0) return null;
  return options[randInt(options.length)];
}

/* ===============================
   HOSPITAL PULL + RECALL
=============================== */
function hospitalPullMaybe(tNow) {
  if (spinActive) return false;
  if (playerSquare === 1) return false;

  if (Math.random() >= HOSPITAL_PULL_CHANCE) return false;

  // Store where you were and allow recall briefly
  lastSafeSquare = playerSquare;
  recallSquare = lastSafeSquare;
  recallExpiresAt = tNow + RECALL_WINDOW_MS;

  // Start a “spin” at the current square, destination is hospital (1)
  spinActive = true;
  spinSquare = playerSquare;
  spinStartT = tNow;
  pendingJumpTo = 1;
  inputLocked = true;

  stringJolt = Math.min(1.2, stringJolt + 0.55);
  return true;
}

function canRecall(tNow) {
  if (!recallSquare) return false;
  if (tNow > recallExpiresAt) return false;
  if (playerSquare !== 1) return false;
  if (inputLocked) return false;
  return true;
}

function attemptRecall(tNow) {
  if (!canRecall(tNow)) return;

  const target = recallSquare;

  // one-shot
  recallSquare = null;
  recallExpiresAt = 0;

  recordMove(target);
  stringJolt = Math.min(1.0, stringJolt + 0.35);

  // If the target is a spinner, it can still mess with you.
  startSpinIfNeeded(playerSquare);
}

/* ===============================
   SPIN LOGIC (spinners + hospital pull)
=============================== */
function startSpinIfNeeded(fromSquare) {
  if (!isSpinnerSquare(fromSquare)) return false;

  const to = chooseSpinnerDestination(fromSquare);
  if (!to || to === fromSquare) return false;

  spinActive = true;
  spinSquare = fromSquare;
  spinStartT = performance.now();
  pendingJumpTo = to;
  inputLocked = true;
  return true;
}

function drawSpinnerOverSquare(n, t) {
  if (!spinActive || spinSquare !== n) return;

  const { x, y, r } = squareCenter(n);
  const radius = r.w * 0.22;

  const p = Math.max(0, Math.min(1, (t - spinStartT) / spinDurationMs));
  const rot = (t - spinStartT) * 0.018;

  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = "#fff";
  ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.restore();

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);

  ctx.lineWidth = Math.max(2, r.w * 0.05);
  ctx.strokeStyle = "rgba(0,0,0,0.75)";
  ctx.lineCap = "round";

  const arcSpan = (Math.PI * 1.6) * (0.75 + 0.25 * (1 - p));
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, arcSpan);
  ctx.stroke();

  ctx.restore();
}

function updateSpin(t) {
  if (!spinActive) return;

  const elapsed = t - spinStartT;
  if (elapsed < spinDurationMs) return;

  spinActive = false;
  const to = pendingJumpTo;
  pendingJumpTo = null;

  recordMove(to);
  stringJolt = Math.min(1.2, stringJolt + 0.45);

  if (!startSpinIfNeeded(playerSquare)) {
    inputLocked = false;
  }
}

/* ===============================
   TOKEN (bottom-right)
=============================== */
function tokenAnchor(t) {
  const a = squareCornerAnchor(playerSquare, "br");
  let cx = a.x;
  let cy = a.y;
  const r = a.r;

  if (spinActive) {
    const p = Math.max(0, Math.min(1, (t - spinStartT) / spinDurationMs));
    const amp = r.w * 0.06 * (1 - p);
    cx += Math.sin((t - spinStartT) * 0.05) * amp;
    cy += Math.cos((t - spinStartT) * 0.06) * amp;
  }

  return { x: cx, y: cy, r };
}

function drawToken(t) {
  const { x: cx, y: cy, r } = tokenAnchor(t);
  const size = r.w * 0.45;

  if (tokenImg.complete && tokenImg.naturalWidth > 0) {
    ctx.drawImage(tokenImg, cx - size / 2, cy - size / 2, size, size);
    ctx.strokeStyle = "rgba(0,0,0,0.55)";
    ctx.lineWidth = 2;
    ctx.strokeRect(cx - size / 2, cy - size / 2, size, size);
  } else {
    ctx.beginPath();
    ctx.arc(cx, cy, size / 2, 0, Math.PI * 2);
    ctx.fillStyle = "red";
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.55)";
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

/* ===============================
   HELP OVERLAY
=============================== */
function toggleHelp(open = !helpOpen) {
  helpOpen = !!open;
  if (helpOpen) {
    try { localStorage.setItem(HELP_SEEN_KEY, "1"); } catch {}
  }
}

function formatHelpLines(tNow) {
  const lines = [
    "Convalescent Snakes & Ladders — controls",
    "",
    "→ / ↑  : forward 1 square",
    "← / ↓  : back 1 square",
    "Space  : forward 1 square",
    "",
    "⟳ Spinner squares: outcome is random.",
    "Hospital pull: sometimes you are snapped back to square 1.",
    `Recall: if pulled back, press R within ${Math.round(RECALL_WINDOW_MS/1000)}s to return.`,
    "",
    "? or H : toggle this help",
    "Esc    : close help"
  ];

  if (canRecall(tNow)) {
    lines.splice(9, 0, "");
    lines.splice(10, 0, "↩ Recall available now: press R.");
  }

  return lines;
}

function drawHelpOverlay(t) {
  if (!helpOpen) return;

  const S = canvas.clientWidth;
  const pad = Math.max(16, S * 0.05);
  const boxW = S - pad * 2;
  const boxH = S - pad * 2;

  ctx.save();

  // Dim background
  ctx.globalAlpha = 0.62;
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, S, S);

  // Card
  ctx.globalAlpha = 0.96;
  ctx.fillStyle = "#fff";
  ctx.fillRect(pad, pad, boxW, boxH);

  // Border
  ctx.globalAlpha = 0.9;
  ctx.strokeStyle = "rgba(0,0,0,0.65)";
  ctx.lineWidth = Math.max(2, S * 0.006);
  ctx.strokeRect(pad, pad, boxW, boxH);

  // Text
  const lines = formatHelpLines(t);
  const left = pad + Math.max(16, S * 0.05);
  let y = pad + Math.max(16, S * 0.05);

  const titleSize = Math.max(16, Math.round(S * 0.045));
  const bodySize  = Math.max(12, Math.round(S * 0.032));

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    if (line === "") {
      y += bodySize * 0.75;
      continue;
    }

    if (i === 0) {
      ctx.fillStyle = "rgba(0,0,0,0.92)";
      ctx.font = `700 ${titleSize}px system-ui`;
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText(line, left, y);
      y += titleSize * 1.25;
      continue;
    }

    ctx.fillStyle = "rgba(0,0,0,0.85)";
    ctx.font = `${bodySize}px system-ui`;
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillText(line, left, y);
    y += bodySize * 1.25;
  }

  ctx.restore();
}

/* ===============================
   MAIN DRAW
=============================== */
function draw(t) {
  const S = canvas.clientWidth;
  ctx.clearRect(0, 0, S, S);

  if (board.complete && board.naturalWidth > 0) {
    ctx.drawImage(board, 0, 0, S, S);
  }

  const visible = getVisibleSet();

  for (let n = 1; n <= 100; n++) {
    const { row, col } = squareToRowCol(n);
    const rect = cellRect(row, col);

    drawTile(tileBySquare[n], rect);
    drawSpinnerHint(n, rect, visible.has(n));

    const entry = squareInfo[n];
    if (!entry || !entry.text) {
      drawSpinnerOverSquare(n, t);
      continue;
    }

    if (n === 1 || visible.has(n)) {
      drawText(entry.text, rect);
    } else {
      const a = fogAlphaForSquare(n);
      drawText(scrambleText(entry.text, n), rect, a);

      ctx.save();
      ctx.globalAlpha = fogVeilForSquare(n);
      ctx.fillStyle = "#fff";
      ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
      ctx.restore();
    }

    drawSpinnerOverSquare(n, t);
  }

  drawTetherString(t);
  drawToken(t);

  // Recall hint near the knot (only when R will actually work)
  if (canRecall(t)) {
    const pin = squareCornerAnchor(1, "br");
    ctx.save();
    ctx.globalAlpha = 0.75;
    ctx.fillStyle = "rgba(0,0,0,0.65)";
    ctx.font = `${Math.max(11, Math.round(pin.r.w * 0.18))}px system-ui`;
    ctx.textAlign = "right";
    ctx.textBaseline = "bottom";
    ctx.fillText("↩ R", pin.x - pin.r.w * 0.08, pin.y - pin.r.w * 0.02);
    ctx.restore();
  }

  // Tiny persistent hint to discover help (kept subtle)
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = "rgba(0,0,0,0.7)";
  ctx.font = `${Math.max(10, Math.round(S * 0.022))}px system-ui`;
  ctx.textAlign = "right";
  ctx.textBaseline = "top";
  ctx.fillText("? for help", S - Math.max(10, S * 0.02), Math.max(6, S * 0.012));
  ctx.restore();

  // Help overlay draws on top of everything
  drawHelpOverlay(t);
}

/* ===============================
   MOVEMENT (1 square at a time)
=============================== */
function attemptStep(delta, tNow) {
  if (inputLocked) return;

  const next = Math.max(1, Math.min(100, playerSquare + delta));
  if (next === playerSquare) return;

  if (playerSquare !== 1) lastSafeSquare = playerSquare;

  recordMove(next);
  stringJolt = Math.min(1.0, stringJolt + 0.25);

  if (startSpinIfNeeded(playerSquare)) return;

  hospitalPullMaybe(tNow);
}

/* ===============================
   INPUT (arrow keys + space + R recall + ? help)
=============================== */
document.addEventListener("keydown", (e) => {
  const tNow = performance.now();

  const code = e.code || "";
  const rawKey = e.key || "";
  const key = rawKey.toLowerCase();

  const isHelp = (key === "?" || key === "h");
  const isEsc = (code === "Escape" || key === "escape");
  const isRecall = (key === "r");

  const isSpace = (code === "Space") || (rawKey === " ") || (rawKey === "Spacebar");
  const isForward =
    (code === "ArrowRight") || (code === "ArrowUp") ||
    (rawKey === "ArrowRight") || (rawKey === "ArrowUp");

  const isBack =
    (code === "ArrowLeft") || (code === "ArrowDown") ||
    (rawKey === "ArrowLeft") || (rawKey === "ArrowDown");

  if (!(isHelp || isEsc || isRecall || isSpace || isForward || isBack)) return;

  e.preventDefault();

  // Help controls
  if (isHelp) {
    toggleHelp(!helpOpen);
    return;
  }
  if (isEsc) {
    toggleHelp(false);
    return;
  }

  // When help is open, we ignore movement so people can read without the board shifting under them
  if (helpOpen) return;

  if (isRecall) {
    attemptRecall(tNow);
    return;
  }

  if (isBack) attemptStep(-1, tNow);
  else attemptStep(+1, tNow);
});

/* ===============================
   HOSPITAL PULL + RECALL
=============================== */
function hospitalPullMaybe(tNow) {
  if (spinActive) return false;
  if (playerSquare === 1) return false;

  if (Math.random() >= HOSPITAL_PULL_CHANCE) return false;

  lastSafeSquare = playerSquare;
  recallSquare = lastSafeSquare;
  recallExpiresAt = tNow + RECALL_WINDOW_MS;

  spinActive = true;
  spinSquare = playerSquare;
  spinStartT = tNow;
  pendingJumpTo = 1;
  inputLocked = true;

  stringJolt = Math.min(1.2, stringJolt + 0.55);
  return true;
}

function canRecall(tNow) {
  if (!recallSquare) return false;
  if (tNow > recallExpiresAt) return false;
  if (playerSquare !== 1) return false;
  if (inputLocked) return false;
  return true;
}

function attemptRecall(tNow) {
  if (!canRecall(tNow)) return;

  const target = recallSquare;

  recallSquare = null;
  recallExpiresAt = 0;

  recordMove(target);
  stringJolt = Math.min(1.0, stringJolt + 0.35);

  startSpinIfNeeded(playerSquare);
}

/* ===============================
   SPIN LOGIC (spinners)
=============================== */
function startSpinIfNeeded(fromSquare) {
  if (!isSpinnerSquare(fromSquare)) return false;

  const to = chooseSpinnerDestination(fromSquare);
  if (!to || to === fromSquare) return false;

  spinActive = true;
  spinSquare = fromSquare;
  spinStartT = performance.now();
  pendingJumpTo = to;
  inputLocked = true;
  return true;
}

function drawSpinnerOverSquare(n, t) {
  if (!spinActive || spinSquare !== n) return;

  const { x, y, r } = squareCenter(n);
  const radius = r.w * 0.22;

  const p = Math.max(0, Math.min(1, (t - spinStartT) / spinDurationMs));
  const rot = (t - spinStartT) * 0.018;

  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = "#fff";
  ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.restore();

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);

  ctx.lineWidth = Math.max(2, r.w * 0.05);
  ctx.strokeStyle = "rgba(0,0,0,0.75)";
  ctx.lineCap = "round";

  const arcSpan = (Math.PI * 1.6) * (0.75 + 0.25 * (1 - p));
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, arcSpan);
  ctx.stroke();

  ctx.restore();
}

function updateSpin(t) {
  if (!spinActive) return;

  const elapsed = t - spinStartT;
  if (elapsed < spinDurationMs) return;

  spinActive = false;
  const to = pendingJumpTo;
  pendingJumpTo = null;

  recordMove(to);
  stringJolt = Math.min(1.2, stringJolt + 0.45);

  // Chain spinners allowed
  if (!startSpinIfNeeded(playerSquare)) {
    inputLocked = false;
  }
}

/* ===============================
   TICK / LOOP
=============================== */
function tick(t) {
  stringJolt *= 0.92;
  if (stringJolt < 0.001) stringJolt = 0;

  updateSpin(t);

  draw(t);
  rafId = requestAnimationFrame(tick);
}

/* ===============================
   START
=============================== */
function maybeOpenHelpOnFirstVisit() {
  try {
    const seen = localStorage.getItem(HELP_SEEN_KEY);
    if (!seen) toggleHelp(true);
  } catch {
    // if storage blocked, just show it once per page load
    toggleHelp(true);
  }
}

async function start() {
  resizeCanvas();

  try {
    await Promise.all([
      loadSquares(),
      loadJumps()
    ]);
  } catch (err) {
    console.error("data failed to load:", err);
  }

  maybeOpenHelpOnFirstVisit();

  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(tick);
}

board.onload = start;
board.onerror = start;

window.addEventListener("resize", () => {
  resizeCanvas();
});

start();
</script>
</body>
